<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>戴维斯双击 · 实时仪表盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0d1117;
    --card-bg: #161b22;
    --border: #30363d;
    --header-bg: #1c2330;
    --hover-bg: #1a2332;
    --text: #c9d1d9;
    --text-muted: #8b949e;
    --text-dim: #6e7681;
    --red: #f85149;
    --green: #3fb950;
    --blue: #58a6ff;
    --yellow: #d29922;
    --purple: #bc8cff;
    --orange: #db6d28;
    --gray: #6e7681;
  }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 13px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .container { max-width: 1920px; margin: 0 auto; padding: 12px 16px; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 12px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .header-title { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; }
  .header-title .accent { color: var(--blue); }
  .header-meta { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .header-meta .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
  .live-dot { background: #f59e0b; }
  .live-dot.active { background: var(--green); animation: pulse 1.5s infinite; }
  .flash-up { animation: flashUp 0.8s ease; }
  .flash-down { animation: flashDown 0.8s ease; }
  @keyframes flashUp { 0% { background: rgba(220,38,38,0.25); } 100% { background: transparent; } }
  @keyframes flashDown { 0% { background: rgba(22,163,74,0.25); } 100% { background: transparent; } }
  #marketIdx { font-weight: 600; }

  /* Stats row - 10 small cards */
  .stats-row {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .stat-mini {
    flex: 1;
    min-width: 90px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
  }
  .stat-mini:hover {
    border-color: var(--blue);
    background: rgba(88,166,255,0.08);
  }
  .stat-mini.active {
    border-color: var(--blue);
    background: rgba(88,166,255,0.12);
    box-shadow: 0 0 12px rgba(88,166,255,0.2);
  }
  .stat-mini.active::after {
    content: '✕';
    position: absolute;
    top: 2px; right: 4px;
    font-size: 10px;
    color: var(--blue);
    opacity: 0.8;
  }
  .stat-mini::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--blue);
  }
  .stat-mini.red::before { background: var(--red); }
  .stat-mini.green::before { background: var(--green); }
  .stat-mini.yellow::before { background: var(--yellow); }
  .stat-mini.orange::before { background: var(--orange); }
  .stat-mini.purple::before { background: var(--purple); }
  .stat-mini.gray::before { background: var(--gray); }
  .stat-mini-label { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; white-space: nowrap; }
  .stat-mini-value { font-size: 22px; font-weight: 700; line-height: 1.1; }
  .stat-mini-value.red { color: var(--red); }
  .stat-mini-value.green { color: var(--green); }
  .stat-mini-value.yellow { color: var(--yellow); }
  .stat-mini-value.orange { color: var(--orange); }
  .stat-mini-value.blue { color: var(--blue); }
  .stat-mini-value.purple { color: var(--purple); }
  .stat-mini-value.gray { color: var(--gray); }

  /* Pool switcher */
  .pool-switcher { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .pool-btn {
    padding: 8px 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .pool-btn:hover { border-color: var(--blue); color: var(--text); }
  .pool-btn.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
    box-shadow: 0 0 10px rgba(88,166,255,0.25);
  }
  .pool-btn .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 7px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    font-size: 11px;
  }

  /* Table container */
  .table-container {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .table-scroll {
    overflow-x: auto;
    overflow-y: visible;
  }
  table.stock-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    table-layout: auto;
  }
  table.stock-table thead th {
    background: var(--header-bg);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    white-space: nowrap;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    cursor: default;
  }
  table.stock-table thead th.left-align { text-align: left; }
  table.stock-table thead th:last-child { border-right: none; }
  /* 表头筛选样式 */
  table.stock-table thead th.th-filter {
    cursor: pointer;
    user-select: none;
    position: relative;
  }
  table.stock-table thead th.th-filter:hover { background: var(--hover-bg); }
  table.stock-table thead th.th-filter .th-arrow {
    font-size: 9px;
    margin-left: 2px;
    opacity: 0.5;
    transition: opacity 0.15s;
  }
  table.stock-table thead th.th-filter:hover .th-arrow { opacity: 1; }
  table.stock-table thead th.th-filter.filtered .th-arrow { opacity: 1; color: var(--blue); }
  table.stock-table thead th.th-filter.filtered { color: var(--blue); }
  /* 下拉浮层 */
  .col-filter-dropdown {
    position: fixed;
    z-index: 9999;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    max-height: 320px;
    overflow-y: auto;
    min-width: 140px;
    font-size: 12px;
  }
  .col-filter-dropdown .cf-item {
    padding: 7px 12px;
    cursor: pointer;
    white-space: nowrap;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .col-filter-dropdown .cf-item:last-child { border-bottom: none; }
  .col-filter-dropdown .cf-item:hover { background: var(--hover-bg); }
  .col-filter-dropdown .cf-item.active {
    background: var(--blue);
    color: #fff;
    font-weight: 600;
  }
  .col-filter-dropdown .cf-item .cf-count {
    float: right;
    opacity: 0.6;
    font-size: 10px;
    margin-left: 8px;
  }
  .col-filter-dropdown .cf-item.active .cf-count { opacity: 0.9; color: #fff; }
  .col-filter-dropdown .cf-header {
    padding: 6px 12px;
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    background: var(--header-bg);
  }
  .col-filter-dropdown .cf-clear {
    padding: 7px 12px;
    cursor: pointer;
    text-align: center;
    color: var(--text-muted);
    font-size: 11px;
    border-top: 1px solid var(--border);
  }
  .col-filter-dropdown .cf-clear:hover { background: var(--hover-bg); color: var(--text); }
  table.stock-table tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  table.stock-table tbody tr:hover { background: var(--hover-bg); }
  table.stock-table tbody td {
    padding: 4px 8px;
    border-right: 1px solid var(--border);
    white-space: nowrap;
    text-align: center;
    vertical-align: middle;
    font-size: 12px;
  }
  table.stock-table tbody td:last-child { border-right: none; }
  table.stock-table tbody td.left-align { text-align: left; }
  table.stock-table tbody td.col-logic { text-align: left; min-width: 200px; max-width: 280px; white-space: normal; word-break: break-all; }
  table.stock-table tbody td.col-score { min-width: 48px; }

  /* Score cell */
  .score-val {
    font-size: 16px;
    font-weight: 700;
    display: block;
  }
  .score-val.high { color: var(--red); }
  .score-val.mid { color: var(--yellow); }
  .score-val.low { color: var(--gray); }

  /* Tier badge */
  .tier-badge {
    display: inline-block;
    width: 22px; height: 22px;
    line-height: 22px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
  }
  .tier-A { background: rgba(248,81,73,0.2); color: var(--red); border: 1px solid rgba(248,81,73,0.4); }
  .tier-B { background: rgba(210,153,34,0.2); color: var(--yellow); border: 1px solid rgba(210,153,34,0.4); }
  .tier-C { background: rgba(110,118,129,0.2); color: var(--text-muted); border: 1px solid var(--border); }

  /* Code */
  .code-text { font-family: "SF Mono", Consolas, "Courier New", monospace; font-size: 11px; color: var(--text-muted); }

  /* Name */
  .name-text { font-weight: 600; color: var(--text); }
  .name-text .warn { color: var(--yellow); margin-right: 2px; }

  /* Sector */
  .sector-main { font-size: 11px; color: var(--text); font-weight: 500; }
  .sector-main.warn { color: var(--yellow); }
  .sector-sub { font-size: 10px; color: var(--text-dim); }

  /* Direction - 上下两行表示不同维度：上行=当日实时主力流向（实底），下行=综合信号（边框） */
  .dir-text {
    display: inline-block;
    color: #fff;
    background: linear-gradient(135deg, #1f6feb 0%, #388bfd 100%);
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.2px;
    box-shadow: 0 1px 2px rgba(31,111,235,0.3);
  }
  .dir-tags { margin-top: 3px; display: flex; flex-wrap: wrap; gap: 2px; }
  .dir-tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    background: transparent;
    color: var(--blue);
    border: 1px solid rgba(91, 156, 214, 0.4);
  }
  .dir-tag-prefix {
    color: var(--text-dim);
    margin-right: 2px;
    font-weight: 600;
  }

  /* Phase badge */
  .phase-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
  }
  .phase-launch { background: rgba(248,81,73,0.2); color: var(--red); border: 1px solid rgba(248,81,73,0.3); }
  .phase-shock { background: rgba(210,153,34,0.15); color: var(--yellow); border: 1px solid rgba(210,153,34,0.3); }
  .phase-up { background: rgba(248,81,73,0.2); color: var(--red); border: 1px solid rgba(248,81,73,0.3); }
  .phase-down { background: rgba(63,185,80,0.15); color: var(--green); border: 1px solid rgba(63,185,80,0.3); }

  /* 启动段三阶段分区标题行 */
  .phase-section-header td {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 700;
    border-top: 2px solid var(--border);
  }
  .phase-section-header .phase-header-icon { font-size: 15px; margin-right: 4px; }
  .phase-section-header .phase-header-count {
    display: inline-block; margin-left: 8px; padding: 1px 8px;
    border-radius: 10px; font-size: 11px; font-weight: 600;
  }
  .phase-section-header .phase-header-score {
    opacity: 0.5; font-weight: 400; font-size: 11px; margin-left: 8px;
  }
  .phase-section-header .phase-header-desc {
    opacity: 0.45; font-weight: 400; font-size: 11px; margin-left: 12px;
  }
  .phase-section-header.on-deck td { background: rgba(248,81,73,0.08); border-left: 3px solid var(--red); }
  .phase-section-header.on-deck .phase-header-count { background: rgba(248,81,73,0.2); color: var(--red); }
  .phase-section-header.approaching td { background: rgba(210,153,34,0.08); border-left: 3px solid var(--yellow); }
  .phase-section-header.approaching .phase-header-count { background: rgba(210,153,34,0.2); color: var(--yellow); }
  .phase-section-header.launched td { background: rgba(88,166,255,0.08); border-left: 3px solid var(--blue); }
  .phase-section-header.launched .phase-header-count { background: rgba(88,166,255,0.2); color: var(--blue); }
  .phase-section-header.capital-out td { background: rgba(139,146,154,0.08); border-left: 3px solid var(--gray, #8b929a); }
  .phase-section-header.capital-out .phase-header-count { background: rgba(139,146,154,0.2); color: var(--gray, #8b929a); }

  /* Price */
  .price-text { font-weight: 600; font-size: 12px; }
  .price-text.up { color: var(--red); }
  .price-text.down { color: var(--green); }
  .price-text.flat { color: var(--text-muted); }

  /* Change pct */
  .chg-pct { font-weight: 600; font-size: 11px; }
  .chg-pct.up { color: var(--red); }
  .chg-pct.down { color: var(--green); }
  .chg-pct.flat { color: var(--text-muted); }

  /* PE/PB */
  .pe-text { font-size: 11px; color: var(--text); }
  .pe-text.neg { color: var(--text-dim); }
  .pb-sub { font-size: 9px; color: var(--text-dim); }

  /* Turnover */
  .turnover-text { font-size: 11px; font-weight: 600; }
  .turnover-text.low { color: var(--text-dim); }
  .turnover-text.normal { color: var(--text); }
  .turnover-text.active { color: var(--yellow); }
  .turnover-text.high { color: var(--red); }

  /* Fundamentals */
  .fund-roe { font-size: 11px; font-weight: 600; }
  .fund-roe.good { color: var(--red); }
  .fund-roe.normal { color: var(--text); }
  .fund-roe.bad { color: var(--green); }
  .fund-sub { font-size: 9px; color: var(--text-dim); }
  .fund-sub .good { color: var(--red); }
  .fund-sub .bad { color: var(--green); }

  /* Dragon tiger badge */
  .dragon-tag {
    display: inline-block;
    margin-left: 2px;
    font-size: 11px;
    cursor: help;
  }

  /* KD */
  .kd-cell { font-size: 11px; font-family: "SF Mono", Consolas, monospace; }
  .kd-cell.gold { color: var(--red); }
  .kd-cell.dead { color: var(--green); }
  .kd-sub { font-size: 9px; color: var(--text-dim); }

  /* MACD */
  .macd-text { font-size: 11px; font-weight: 600; }
  .macd-text.gold { color: var(--red); }
  .macd-text.dead { color: var(--green); }

  /* RSI */
  .rsi-text { font-size: 11px; }
  .rsi-text.oversold { color: var(--yellow); font-weight: 600; }
  .rsi-text.overbought { color: var(--red); font-weight: 600; }

  /* MA */
  .ma-text { font-size: 10px; }
  .ma-text.bull { color: var(--red); }
  .ma-text.bear { color: var(--green); }
  .ma-text.mix { color: var(--yellow); }
  .ma20-sub { font-size: 9px; margin-top: 1px; }
  .ma20-sub.above { color: var(--red); }
  .ma20-sub.below { color: var(--green); }

  /* Trend */
  .trend-text { font-size: 10px; }
  .trend-text.up { color: var(--red); }
  .trend-text.down { color: var(--green); }
  .trend-text.flat { color: var(--text-muted); }
  .trend-pct { font-size: 10px; color: var(--text-dim); }

  /* Vol signal */
  .vol-text { font-size: 10px; color: var(--blue); }

  /* Main flow */
  .flow-main { font-size: 11px; font-weight: 600; }
  .flow-main.pos { color: var(--red); }
  .flow-main.neg { color: var(--green); }
  .flow-date { font-size: 9px; color: var(--text-dim); }
  .flow-pct { font-size: 9px; }
  .flow-pct.pos { color: var(--red); }
  .flow-pct.neg { color: var(--green); }

  /* Open rate */
  .open-rate-main { font-size: 11px; font-weight: 600; color: var(--text); }
  .open-rate-sub { font-size: 9px; color: var(--text-dim); }

  /* 5d/10d flow */
  .flow-line { font-size: 10px; display: block; }
  .flow-line.pos { color: var(--red); }
  .flow-line.neg { color: var(--green); }
  .flow-line.neutral { color: var(--text-muted); }

  /* Sector resonance */
  .reson-main { font-size: 10px; font-weight: 600; }
  .reson-main.active { color: var(--red); }
  .reson-main.partial { color: var(--yellow); }
  .reson-main.none { color: var(--text-dim); }
  .reson-sub { font-size: 9px; color: var(--text-dim); }

  /* Beta */
  .beta-main { font-size: 11px; font-weight: 600; color: var(--blue); }
  .beta-cat { font-size: 10px; color: var(--text-muted); }
  .beta-sub { font-size: 9px; color: var(--text-dim); }

  /* Support */
  .support-main { font-size: 11px; color: var(--text); }
  .support-main.near { color: var(--yellow); font-weight: 600; }
  .support-dist { font-size: 9px; color: var(--text-dim); }

  /* Logic */
  .logic-text { font-size: 10px; color: var(--text-muted); line-height: 1.4; white-space: normal; }

  /* NEW badge */
  .new-tag {
    display: inline-block;
    margin-left: 3px;
    font-size: 8px;
    padding: 1px 4px;
    background: var(--red);
    color: #fff;
    border-radius: 3px;
    font-weight: 700;
    vertical-align: middle;
  }

  /* KD超卖闪烁 */
  @keyframes kdOversoldFlash {
    0%, 100% { background: var(--card-bg); }
    50% { background: rgba(210, 153, 34, 0.15); }
  }
  tr.kd-oversold {
    animation: kdOversoldFlash 1.5s ease-in-out infinite;
  }

  /* KD多级水位标签 */
  .kd-badge { display: inline-block; font-size: 9px; font-weight: 700; padding: 1px 4px; border-radius: 3px; margin-left: 3px; vertical-align: middle; }
  .kd-deep { background: rgba(29, 158, 117, 0.2); color: rgb(29, 158, 117); }
  .kd-low { background: rgba(55, 138, 221, 0.2); color: rgb(55, 138, 221); }
  .kd-mid { background: rgba(136, 135, 128, 0.15); color: var(--text-dim); }
  .kd-high { background: rgba(239, 159, 39, 0.2); color: rgb(239, 159, 39); }
  .kd-extreme { background: rgba(226, 75, 74, 0.2); color: rgb(226, 75, 74); }
  .kd-early { background: rgba(29, 158, 117, 0.25); color: rgb(29, 158, 117); border: 1px solid rgba(29, 158, 117, 0.4); }

  @keyframes kdEarlyPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(29, 158, 117, 0.3); }
    50% { box-shadow: 0 0 6px 2px rgba(29, 158, 117, 0.2); }
  }
  .kd-early { animation: kdEarlyPulse 2s ease-in-out infinite; }
  tr.kd-early-row { border-left: 3px solid rgba(29, 158, 117, 0.5); }
  tr.kd-high-row { border-left: 3px solid rgba(239, 159, 39, 0.4); }

  /* Policy section */
  .policy-section { margin-top: 20px; }
  .section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    padding-left: 10px;
    border-left: 3px solid var(--blue);
  }
  .policy-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 10px;
  }
  .policy-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 14px;
    border-left: 3px solid var(--purple);
  }
  .policy-card.supply { border-left-color: var(--yellow); }
  .policy-card.demand { border-left-color: var(--green); }
  .policy-card.earnings { border-left-color: var(--orange); }
  .policy-card-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
  .policy-card-status {
    display: inline-block;
    font-size: 10px;
    padding: 1px 7px;
    background: rgba(188,140,255,0.15);
    color: var(--purple);
    border-radius: 3px;
    margin-left: 6px;
    font-weight: 500;
  }
  .policy-card-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 5px; line-height: 1.5; }

var COL_DEFS = {
  score: { type: 'range', field: 'healthScore', label: '评分', buckets: [
    { l: '全部', min: -Infinity, max: Infinity },
    { l: '≥80', min: 80, max: Infinity },
    { l: '70-79', min: 70, max: 80 },
    { l: '60-69', min: 60, max: 70 },
    { l: '50-59', min: 50, max: 60 },
    { l: '<50', min: -Infinity, max: 50 }
  ]},
  tier: { type: 'enum', field: 'tier', label: '梯队' },
  sector: { type: 'enum', field: 'sector', label: '赛道' },
  driver: { type: 'enum', label: '驱动方向', getValue: function(s) {
    if (s.driver) return s.driver;
    if (s.sector && s.sector.indexOf('热门') >= 0) return '热门标的';
    return '';
  },
  // 自定义下拉选项生成：从 direction + riskFlags 提取所有唯一标签
  buildOptions: function(pool) {
    var counts = {};
    pool.forEach(function(s) {
      if (s.direction) counts[s.direction] = (counts[s.direction] || 0) + 1;
      if (Array.isArray(s.riskFlags)) {
        s.riskFlags.forEach(function(tag) {
          if (tag && tag !== '🔄全量选入') counts[tag] = (counts[tag] || 0) + 1;
        });
      }
    });
    // 排序：资金流入/资金流出 优先，然后按计数
    var keys = Object.keys(counts);
    keys.sort(function(a, b) {
      var priority = ['资金流入', '资金流出', '主力介入', '主力流出'];
      var ai = priority.indexOf(a);
      var bi = priority.indexOf(b);
      if (ai >= 0 && bi >= 0) return ai - bi;
      if (ai >= 0) return -1;
      if (bi >= 0) return 1;
      return counts[b] - counts[a];
    });
    return keys.map(function(k) { return { value: k, count: counts[k] }; });
  },
  // 自定义匹配：direction 字段匹配 OR riskFlags 包含
  matchStock: function(stock, filterVal) {
    if (stock.direction === filterVal) return true;
    if (Array.isArray(stock.riskFlags) && stock.riskFlags.indexOf(filterVal) >= 0) return true;
    return false;
  }},
  phase: { type: 'enum', label: '阶段', getValue: function(s) {
    var p = s.phase || s.preLaunchPhase || '';
    return PHASE_DISPLAY_MAP[p] || p;
  }},
  price: { type: 'range', field: 'price', label: '现价', buckets: [
    { l: '全部', min: 0, max: Infinity },
    { l: '<10', min: 0, max: 10 },
    { l: '10-30', min: 10, max: 30 },
    { l: '30-50', min: 30, max: 50 },
    { l: '50-100', min: 50, max: 100 },
    { l: '>100', min: 100, max: Infinity }
  ]},
  changePct: { type: 'range', field: 'changePct', label: '涨跌幅', buckets: [
    { l: '全部', min: -Infinity, max: Infinity },
    { l: '涨停≥9.5%', min: 9.5, max: Infinity },
    { l: '涨>5%', min: 5, max: 9.5 },
    { l: '涨0-5%', min: 0, max: 5 },
    { l: '跌0-5%', min: -5, max: 0 },
    { l: '跌>5%', min: -Infinity, max: -5 }
  ]},
  turnover: { type: 'range', field: 'turnover', label: '换手率', buckets: [
    { l: '全部', min: 0, max: Infinity },
    { l: '<1%', min: 0, max: 1 },
    { l: '1-5%', min: 1, max: 5 },
    { l: '5-10%', min: 5, max: 10 },
    { l: '>10%', min: 10, max: Infinity }
  ]},
  pepb: { type: 'range', field: 'pe', label: 'PE/PB', buckets: [
    { l: '全部', min: -Infinity, max: Infinity },
    { l: 'PE<15', min: 0, max: 15 },
    { l: 'PE 15-30', min: 15, max: 30 },
    { l: 'PE 30-60', min: 30, max: 60 },
    { l: 'PE>60', min: 60, max: Infinity },
    { l: '亏损/无PE', min: -Infinity, max: 0 }
  ]},
  fund: { type: 'range', field: 'roe', label: '基本面(ROE)', buckets: [
    { l: '全部', min: -Infinity, max: Infinity },
    { l: 'ROE≥15%', min: 15, max: Infinity },
    { l: 'ROE 10-15%', min: 10, max: 15 },
    { l: 'ROE 0-10%', min: 0, max: 10 },
    { l: 'ROE<0', min: -Infinity, max: 0 }
  ]},
  kd5: { type: 'enum', field: 'kd5_cross', label: '5分钟KD' },
  kd30: { type: 'enum', field: 'kd30_cross', label: '30分钟KD' },
  macd: { type: 'enum', label: 'MACD', getValue: function(s) {
    var m = s.macd || '';
    if (m.indexOf('金叉') >= 0) return '金叉';
    if (m.indexOf('死叉') >= 0) return '死叉';

  }},
  rsi: { type: 'range', field: 'rsi', label: 'RSI', buckets: [
    { l: '全部', min: 0, max: 100 },
    { l: '超买>70', min: 70, max: 100 },
    { l: '50-70', min: 50, max: 70 },
    { l: '30-50', min: 30, max: 50 },
    { l: '超卖<30', min: 0, max: 30 }
  ]},
  ma: { type: 'enum', field: 'ma', label: '均线' },
  trend: { type: 'enum', field: 'trend', label: '趋势' },
  volsig: { type: 'enum', field: 'volSignal', label: '量价信号' },
  mainflow: { type: 'enum', label: '主力资金', getValue: function(s) {
    var f = s.mainFlow || '';
    if (!f) return '无数据';
    if (f.indexOf('-') >= 0 || f.indexOf('流出') >= 0) return '流出';

  highopen: { type: 'range', field: 'openRate30d', label: '30日高开率', buckets: [
    { l: '全部', min: 0, max: 100 },
    { l: '≥40%', min: 40, max: 100 },
    { l: '20-40%', min: 20, max: 40 },
    { l: '<20%', min: 0, max: 20 }

  flow510: { type: 'enum', label: '5日资金', getValue: function(s) {

  sectorres: { type: 'enum', field: 'sectorResonance', label: '板块共振' },
  beta: { type: 'enum', field: 'betaCategory', label: '大盘β' }
};

function getColValue(stock, colKey) {
  var def = COL_DEFS[colKey];
  if (!def) return undefined;
  if (def.getValue) return def.getValue(stock);
  if (def.field) {
    var v = stock[def.field];
    if (v === undefined || v === null || v === '') return undefined;
    return v;
  }
  return undefined;
}

function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function toggleColFilter(colKey, event) {
  if (event) { event.stopPropagation(); event.preventDefault(); }
  if (_colFilterDropdown) {
    var isOpen = _colFilterDropdown.getAttribute('data-col') === colKey;
    _colFilterDropdown.remove();
    _colFilterDropdown = null;
    if (isOpen) return;
  }
  var def = COL_DEFS[colKey];
  if (!def) return;
  var th = event ? event.currentTarget : null;
  if (!th) th = document.querySelector('th[data-col="' + colKey + '"]');
  if (!th) return;
  var rect = th.getBoundingClientRect();
  var dropdown = document.createElement('div');
  dropdown.className = 'col-filter-dropdown';
  dropdown.setAttribute('data-col', colKey);
  dropdown.style.left = Math.min(rect.left, window.innerWidth - 200) + 'px';
  dropdown.style.top = (rect.bottom + 2) + 'px';
  var pool = currentPool === 'stocks' ? STOCKS : LAUNCH_STOCKS;
  var html = '<div class="cf-header">' + escapeHtml(def.label || colKey) + ' 筛选</div>';
  if (def.type === 'enum') {
    var counts = {};
    var options = [];
    if (def.buildOptions) {
      // 自定义下拉选项（如驱动方向：从direction+riskFlags提取）
      options = def.buildOptions(pool);
    } else {
      pool.forEach(function(s) {
        var v = getColValue(s, colKey);
        var key = (v === undefined || v === null || v === '') ? '(空)' : String(v);
        counts[key] = (counts[key] || 0) + 1;
      });
      options = Object.keys(counts).sort().map(function(k) { return { value: k, count: counts[k] }; });
    }
    html += '<div class="cf-item' + (!colFilters[colKey] ? ' active' : '') + '" data-val="__all__">全部<span class="cf-count">' + pool.length + '</span></div>';
    options.forEach(function(opt) {
      var k = opt.value;
      var active = colFilters[colKey] === k ? ' active' : '';
      html += '<div class="cf-item' + active + '" data-val="' + escapeAttr(k) + '">' + escapeHtml(k) + '<span class="cf-count">' + opt.count + '</span></div>';
    });
  } else if (def.type === 'range') {
    html += '<div class="cf-item' + (!colFilters[colKey] ? ' active' : '') + '" data-val="__all__">全部<span class="cf-count">' + pool.length + '</span></div>';
    def.buckets.forEach(function(b) {
      if (b.l === '全部') return;
      var cnt = pool.filter(function(s) {
        var v = getColValue(s, colKey);
        if (v === undefined || v === null) return false;
        var n = Number(v);
        if (isNaN(n)) return false;
        return n >= b.min && n < b.max;
      }).length;
      var active = colFilters[colKey] && colFilters[colKey].l === b.l ? ' active' : '';
      html += '<div class="cf-item' + active + '" data-val="' + escapeAttr(b.l) + '">' + escapeHtml(b.l) + '<span class="cf-count">' + cnt + '</span></div>';
    });
  }
  if (colFilters[colKey]) {
    html += '<div class="cf-clear">✕ 清除筛选</div>';
  }
  dropdown.innerHTML = html;
  document.body.appendChild(dropdown);
  _colFilterDropdown = dropdown;
  dropdown.querySelectorAll('.cf-item').forEach(function(item) {
    item.addEventListener('click', function(e) {
      e.stopPropagation();
      var val = item.getAttribute('data-val');
      if (val === '__all__') {
        delete colFilters[colKey];
      } else if (def.type === 'range') {
        var bucket = def.buckets.find(function(b) { return b.l === val; });
        if (bucket) colFilters[colKey] = bucket;
      } else {
        colFilters[colKey] = val;
      }
      var thEl = document.querySelector('th[data-col="' + colKey + '"]');
      if (thEl) thEl.classList.toggle('filtered', !!colFilters[colKey]);
      closeColFilter();
      renderStocks();
    });
  });
  var clearBtn = dropdown.querySelector('.cf-clear');
  if (clearBtn) {
    clearBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      delete colFilters[colKey];
      var thEl = document.querySelector('th[data-col="' + colKey + '"]');
      if (thEl) thEl.classList.remove('filtered');
      closeColFilter();
      renderStocks();
    });
  }
}

function closeColFilter() {
  if (_colFilterDropdown) {
    _colFilterDropdown.remove();
    _colFilterDropdown = null;
  }
}

document.addEventListener('click', function(e) {
  if (!_colFilterDropdown) return;
  if (_colFilterDropdown.contains(e.target)) return;
  if (e.target.closest && e.target.closest('th.th-filter')) return;
  closeColFilter();
});

// 绑定表头点击事件
function setupColFilterHeaders() {
  document.querySelectorAll('th.th-filter').forEach(function(th) {
    var colKey = th.getAttribute('data-col');
    if (!colKey) return;
    th.addEventListener('click', function(e) {
      toggleColFilter(colKey, e);
    });
  });
}

function getFilteredPool() {
  var pool = currentPool === 'stocks' ? STOCKS : LAUNCH_STOCKS;
  if (activeStatFilter) {
    var cfg = STAT_FILTERS[activeStatFilter];
    if (cfg) pool = pool.filter(cfg.predicate);
  }
  var colKeys = Object.keys(colFilters);
  if (colKeys.length === 0) return pool;
  return pool.filter(function(s) {
    for (var i = 0; i < colKeys.length; i++) {
      var key = colKeys[i];
      var filter = colFilters[key];
      var def = COL_DEFS[key];
      if (!def) continue;
      if (def.type === 'enum') {
        // 自定义匹配（如驱动方向：direction + riskFlags 联合匹配）
        if (def.matchStock) {
          if (!def.matchStock(s, filter)) return false;
        } else {
          var v = getColValue(s, key);
          var actualVal = (v === undefined || v === null || v === '') ? '(空)' : String(v);
          if (actualVal !== String(filter)) return false;
        }
      } else if (def.type === 'range') {
        if (s[key] === undefined || s[key] === null) return false;
        var n = Number(s[key]);
        if (isNaN(n)) return false;
        if (n < filter.min || n >= filter.max) return false;
      }
    }
    return true;
  });
}
let quoteData = {};
let quoteTimer = null;
let countdownTimer = null;

// 工具函数
// ============================================
function extractNum(code) {
  return code.replace(/^(sh|sz|bj)/, '');
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

function scoreClass(score) {
  if (score >= 60) return 'high';
  if (score >= 50) return 'mid';
  return 'low';
}

function phaseClass(phase) {
  if (!phase) return 'phase-shock';
  if (phase.indexOf('资金流出') >= 0 || phase.indexOf('非启动') >= 0) return 'phase-down';
  if (phase.indexOf('高位') >= 0 || phase.indexOf('偏高') >= 0) return 'phase-down';
  if (phase.indexOf('启动') >= 0) return 'phase-launch';
  if (phase.indexOf('加速') >= 0) return 'phase-up';
  if (phase.indexOf('震荡') >= 0 || phase.indexOf('蓄势') >= 0) return 'phase-shock';
  if (phase.indexOf('上涨') >= 0) return 'phase-up';
  if (phase.indexOf('下跌') >= 0 || phase.indexOf('回落') >= 0 || phase.indexOf('尾部') >= 0) return 'phase-down';
  return 'phase-shock';
}

function maClass(ma) {
  if (!ma) return '';
  if (ma.indexOf('多头') >= 0 && ma.indexOf('空头') < 0) return 'bull';
  if (ma.indexOf('空头') >= 0) return 'bear';
  return 'mix';
}

function trendClass(trend) {
  if (!trend) return 'flat';
  if (trend.indexOf('上涨') >= 0) return 'up';
  if (trend.indexOf('下跌') >= 0) return 'down';
  return 'flat';
}

function isPositiveFlow(str) {
  const s = String(str || '');
  return s.indexOf('+') >= 0 || /^\d/.test(s);
}

// ============================================
// 渲染统计卡片（10个）
// ============================================
function renderStats() {
  const pool = currentPool === 'stocks' ? STOCKS : LAUNCH_STOCKS;
  const allPool = [...STOCKS, ...LAUNCH_STOCKS];

  // 计算各统计项
  let upCount = 0, downCount = 0, flatCount = 0;
    let kd5Oversold = 0, kd30Oversold = 0;
    let washCount = 0, shipCount = 0;
    let aboveMA20Count = 0;
    let launchCount = 0, accelCount = 0, tailCount = 0, kdHighPhaseCount = 0;
    let onDeckCount = 0, approachingCount = 0, launchedCount = 0;
    let kdEarlyCount = 0, kdHighCount = 0;
    let capitalOutCount = 0;

  pool.forEach(s => {
    // 涨跌
    const chg = quoteData[s.code] ? quoteData[s.code].changePct : s.changePct;

    // KD超卖 (从缓存取K值)
    const _num = extractNum(s.code);
    const _kdj = KDJ_PRECOMPUTED[_num] || {};
    const _k = s.kd5_k !== undefined ? s.kd5_k : _kdj.k;
    if (chg > 0) upCount++;
    else if (chg < 0) downCount++;
    else flatCount++;

    // KD超卖 (K<20 或 RSI<30)
    if (_k !== undefined && (_k < 20 || s.rsi < 30)) kd5Oversold++;
    if (s.kd30_k !== undefined && (s.kd30_k < 20 || s.rsi < 30)) kd30Oversold++;

    // KD低位预警 + KD高位警告
    var _k30 = s.kd30_k, _d30 = s.kd30_d, _k5 = s.kd5_k, _d5 = s.kd5_d;
    if (_k30 !== undefined) {
      var _k5Up = (_k5 !== undefined && _d5 !== undefined && _k5 > _d5);
      var _k30Appr = (_d30 !== undefined && Math.abs(_k30 - _d30) < 5);
      if (_k30 < 25 || (_k30 < 35 && _k30Appr && _k5Up) || (_k30 < 35 && _k5Up && _k5 < 30)) kdEarlyCount++;
      if (_k30 >= 75) kdHighCount++;
    }

    // 量价信号
    if (s.volSignal) {
      if (s.volSignal.indexOf('吸筹') >= 0 || s.volSignal.indexOf('缩量止跌') >= 0) washCount++;
      if (s.volSignal.indexOf('出货') >= 0) shipCount++;
    }

    // 收盘价>20日线
    const _p = quoteData[s.code] ? quoteData[s.code].price : s.price;
    if (s.ma20 !== undefined && _p !== undefined && _p !== null && _p > s.ma20) aboveMA20Count++;

    // 阶段（统一用 preLaunchPhase 英文代码判断）
    const _phase = s.preLaunchPhase || '';
    if (_phase === 'on_deck') { onDeckCount++; }
    else if (_phase === 'approaching') { approachingCount++; }
    else if (_phase === 'building' || _phase === 'launching') { launchedCount++; }
    else if (_phase === 'accelerating') { accelCount++; }
    else if (_phase === 'tail') { tailCount++; }
    else if (_phase === 'overbought_wait' || _phase === 'high_caution') { kdHighPhaseCount++; }
    else if (_phase === 'capital_outflow') { capitalOutCount++; }

    // 综合最优池模式：启动段=启动系列（启动在即+接近启动+启动段），与launch筛选器口径一致
    if (_phase === 'on_deck' || _phase === 'approaching' || _phase === 'building' || _phase === 'launching') launchCount++;
    else if (_phase === 'accelerating') accelCount++;
    else if (_phase === 'tail') tailCount++;
  });

  // 如果pool为空，显示0
  const html = `
    <div class="stat-mini red ${activeStatFilter === 'up' ? 'active' : ''}" onclick="setStatFilter('up')">
      <div class="stat-mini-label">上涨</div>
      <div class="stat-mini-value red">${upCount}</div>
    </div>
    <div class="stat-mini green ${activeStatFilter === 'down' ? 'active' : ''}" onclick="setStatFilter('down')">
      <div class="stat-mini-label">下跌</div>
      <div class="stat-mini-value green">${downCount}</div>
    </div>
    <div class="stat-mini gray ${activeStatFilter === 'flat' ? 'active' : ''}" onclick="setStatFilter('flat')">
      <div class="stat-mini-label">平盘</div>
      <div class="stat-mini-value gray">${flatCount}</div>
    </div>
    <div class="stat-mini yellow ${activeStatFilter === 'kd5Oversold' ? 'active' : ''}" onclick="setStatFilter('kd5Oversold')">
      <div class="stat-mini-label">5分钟KD超卖</div>
      <div class="stat-mini-value yellow">${kd5Oversold}</div>
    </div>
    <div class="stat-mini yellow ${activeStatFilter === 'kd30Oversold' ? 'active' : ''}" onclick="setStatFilter('kd30Oversold')">
      <div class="stat-mini-label">30分钟KD超卖</div>
      <div class="stat-mini-value yellow">${kd30Oversold}</div>
    </div>
    <div class="stat-mini red ${activeStatFilter === 'kdEarlySignal' ? 'active' : ''}" onclick="setStatFilter('kdEarlySignal')">
      <div class="stat-mini-label">KD低位预警</div>
      <div class="stat-mini-value red">${kdEarlyCount}</div>
    </div>
    <div class="stat-mini purple ${activeStatFilter === 'kdHighWarn' ? 'active' : ''}" onclick="setStatFilter('kdHighWarn')">
      <div class="stat-mini-label">KD高位警告</div>
      <div class="stat-mini-value purple">${kdHighCount}</div>
    </div>
    <div class="stat-mini orange ${activeStatFilter === 'wash' ? 'active' : ''}" onclick="setStatFilter('wash')">
      <div class="stat-mini-label">洗盘信号</div>
      <div class="stat-mini-value orange">${washCount}</div>
    </div>
    <div class="stat-mini red ${activeStatFilter === 'aboveMA20' ? 'active' : ''}" onclick="setStatFilter('aboveMA20')">
      <div class="stat-mini-label">站上20日线</div>
      <div class="stat-mini-value red">${aboveMA20Count}</div>
    </div>
    <div class="stat-mini red ${activeStatFilter === 'ship' ? 'active' : ''}" onclick="setStatFilter('ship')">
      <div class="stat-mini-label">出货警告</div>
      <div class="stat-mini-value red">${shipCount}</div>
    </div>
    ${currentPool === 'launch' ? `
    <div class="stat-mini red ${activeStatFilter === 'onDeck' ? 'active' : ''}" onclick="setStatFilter('onDeck')">
      <div class="stat-mini-label">⏳ 启动在即</div>
      <div class="stat-mini-value red">${onDeckCount}</div>
    </div>
    <div class="stat-mini yellow ${activeStatFilter === 'approachingPhase' ? 'active' : ''}" onclick="setStatFilter('approachingPhase')">
      <div class="stat-mini-label">🔍 接近启动</div>
      <div class="stat-mini-value yellow">${approachingCount}</div>
    </div>
    <div class="stat-mini blue ${activeStatFilter === 'launchedPhase' ? 'active' : ''}" onclick="setStatFilter('launchedPhase')">
      <div class="stat-mini-label">🚀 启动段</div>
      <div class="stat-mini-value blue">${launchedCount}</div>
    </div>
    <div class="stat-mini purple ${activeStatFilter === 'accel' ? 'active' : ''}" onclick="setStatFilter('accel')">
      <div class="stat-mini-label">⚡ 加速段</div>
      <div class="stat-mini-value purple">${accelCount}</div>
    </div>
    <div class="stat-mini gray ${activeStatFilter === 'tail' ? 'active' : ''}" onclick="setStatFilter('tail')">
      <div class="stat-mini-label">📉 回落段</div>
      <div class="stat-mini-value gray">${tailCount}</div>
    </div>
    <div class="stat-mini orange ${activeStatFilter === 'kdHighPhase' ? 'active' : ''}" onclick="setStatFilter('kdHighPhase')">
      <div class="stat-mini-label">🌡️ KD高位</div>
      <div class="stat-mini-value orange">${kdHighPhaseCount}</div>
    </div>
    <div class="stat-mini gray ${activeStatFilter === 'capitalOut' ? 'active' : ''}" onclick="setStatFilter('capitalOut')" title="KD虽在低位但主力资金净流出，启动信号不成立">
      <div class="stat-mini-label">📉 资金流出</div>
      <div class="stat-mini-value gray">${capitalOutCount}</div>
    </div>
    ` : `
    <div class="stat-mini blue ${activeStatFilter === 'launch' ? 'active' : ''}" onclick="setStatFilter('launch')" title="启动在即+接近启动+启动段 三阶段合计">
      <div class="stat-mini-label">启动系列</div>
      <div class="stat-mini-value blue">${launchCount}</div>
    </div>
    <div class="stat-mini red ${activeStatFilter === 'onDeck' ? 'active' : ''}" onclick="setStatFilter('onDeck')" title="K<15 深度超卖，启动信号最纯粹">
      <div class="stat-mini-label">⏳ 启动在即</div>
      <div class="stat-mini-value red">${onDeckCount}</div>
    </div>
    <div class="stat-mini yellow ${activeStatFilter === 'approachingPhase' ? 'active' : ''}" onclick="setStatFilter('approachingPhase')" title="K 15-25 接近金叉">
      <div class="stat-mini-label">🔍 接近启动</div>
      <div class="stat-mini-value yellow">${approachingCount}</div>
    </div>
    <div class="stat-mini blue ${activeStatFilter === 'launchedPhase' ? 'active' : ''}" onclick="setStatFilter('launchedPhase')" title="K 25-40 已启动但未加速">
      <div class="stat-mini-label">🚀 启动段</div>
      <div class="stat-mini-value blue">${launchedCount}</div>
    </div>
    <div class="stat-mini purple ${activeStatFilter === 'accel' ? 'active' : ''}" onclick="setStatFilter('accel')">
      <div class="stat-mini-label">⚡ 加速段</div>
      <div class="stat-mini-value purple">${accelCount}</div>
    </div>
    <div class="stat-mini gray ${activeStatFilter === 'tail' ? 'active' : ''}" onclick="setStatFilter('tail')">
      <div class="stat-mini-label">📉 回落段</div>
      <div class="stat-mini-value gray">${tailCount}</div>
    </div>
    <div class="stat-mini orange ${activeStatFilter === 'kdHighPhase' ? 'active' : ''}" onclick="setStatFilter('kdHighPhase')">
      <div class="stat-mini-label">🌡️ KD高位</div>
      <div class="stat-mini-value orange">${kdHighPhaseCount}</div>
    </div>
    <div class="stat-mini gray ${activeStatFilter === 'capitalOut' ? 'active' : ''}" onclick="setStatFilter('capitalOut')" title="KD虽在低位但主力资金净流出，启动信号不成立">
      <div class="stat-mini-label">📉 资金流出</div>
      <div class="stat-mini-value gray">${capitalOutCount}</div>
    </div>
    `}
  `;
  document.getElementById('statsRow').innerHTML = html;
}

// ============================================
// 渲染表格行
// ============================================
function renderStockRow(stock, index) {
  const num = extractNum(stock.code);
  const kdj = KDJ_PRECOMPUTED[num] || {};
  const flow = CAPITAL_FLOW_CACHE[num] || {};
  const corr = MARKET_CORR_CACHE[num] || {};

  // 实时行情覆盖
  const q = quoteData[stock.code] || {};
  const price = q.price !== undefined ? q.price : stock.price;
  const changePct = q.changePct !== undefined ? q.changePct : stock.changePct;

  // 评分（启动段模式优先显示预启动分）
  const score = currentPool === 'launch'
    ? (stock.preLaunchScore !== undefined ? stock.preLaunchScore : stock.healthScore || 0)
    : (stock.healthScore || 0);
  const sCls = scoreClass(score);

  // 梯队
  const tier = stock.tier || 'C';

  // 名称（热门标的加警告，龙虎榜加标记）
  const isHot = stock.sector && stock.sector.indexOf('热门') >= 0;
  const hasDragon = stock.dragonTiger === true;
  const dragonBadge = hasDragon
    ? `<span class="dragon-tag" title="${escapeHtml(stock.dragonTigerReason || '龙虎榜')}">🐲</span>`
    : '';
  const nameHtml = isHot
    ? `<span class="name-text"><span class="warn">⚠️</span>${escapeHtml(stock.name)}</span>${dragonBadge}`
    : `<span class="name-text">${escapeHtml(stock.name)}</span>${dragonBadge}`;
  const newTag = stock.isNew ? '<span class="new-tag">NEW</span>' : '';

  // 赛道
  const sectorWarn = isHot ? 'warn' : '';
  const sectorHtml = `<div class="sector-main ${sectorWarn}">${escapeHtml(stock.sector || '--')}</div>` +
    (stock.subSector ? `<div class="sector-sub">${escapeHtml(stock.subSector)}</div>` : '');

  // 阶段（兼容 preLaunchPhase 字段）
  const phaseRaw = stock.phase || stock.preLaunchPhase || '';
  const phaseMap = { 'on_deck': '⏳启动在即', 'approaching': '🔍接近启动', 'building': '🚀启动段', 'launching': '🚀启动段', 'accelerating': '⚡加速段', 'tail': '📉回落段', 'overbought_wait': '⚠️KD高位等回调', 'high_caution': '🟠KD偏高谨慎', 'capital_outflow': '📉资金流出·非启动' };
  const phaseDisplay = phaseMap[phaseRaw] || phaseRaw;
  const pCls = phaseClass(phaseDisplay);
  const phaseShort = phaseDisplay ? phaseDisplay.replace('（', '(').replace('）', ')') : '--';

  // 现价
  let priceCls = 'flat';
  if (changePct > 0) priceCls = 'up';
  else if (changePct < 0) priceCls = 'down';

  // 涨跌幅
  const chgStr = changePct !== undefined && changePct !== null
    ? (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%'
    : '--';

  // PE/PB
  const pe = stock.pe;
  const pb = stock.pb;
  let pePbHtml = '';
  if (pe !== undefined && pe !== null && pe > 0) {
    pePbHtml = `<span class="pe-text">${pe.toFixed(1)}</span>`;
  } else {
    pePbHtml = `<span class="pe-text">--</span>`;
  }
  if (pb !== undefined && pb !== null && pb > 0) {
    pePbHtml += `<div class="pb-sub">PB ${pb.toFixed(2)}</div>`;
  }

  // 换手率
  const turnover = stock.turnover;
  let turnoverCls = 'normal';
  if (turnover !== undefined && turnover !== null) {
    if (turnover < 1) turnoverCls = 'low';
    else if (turnover >= 10) turnoverCls = 'high';
    else if (turnover >= 5) turnoverCls = 'active';
  }
  const turnoverHtml = turnover !== undefined && turnover !== null
    ? `<span class="turnover-text ${turnoverCls}">${turnover.toFixed(2)}%</span>`
    : '<span class="turnover-text">--</span>';

  // 基本面（ROE/毛利率/增速）
  const roe = stock.roe;
  const grossMargin = stock.grossMargin;
  const revGrowth = stock.revGrowth;
  const profitGrowth = stock.profitGrowth;
  let fundHtml = '';
  if (roe !== undefined && roe !== null) {
    let roeCls = roe >= 10 ? 'good' : (roe >= 0 ? 'normal' : 'bad');
    fundHtml += `<span class="fund-roe ${roeCls}">ROE ${roe.toFixed(1)}%</span>`;
  }
  if (grossMargin !== undefined && grossMargin !== null) {
    fundHtml += `<div class="fund-sub">毛利${grossMargin.toFixed(0)}%`;
    if (revGrowth !== undefined && revGrowth !== null) {
      fundHtml += ` 营收${revGrowth >= 0 ? '+' : ''}${revGrowth.toFixed(0)}%`;
    }
    if (profitGrowth !== undefined && profitGrowth !== null) {
      let pgCls = profitGrowth >= 30 ? 'good' : (profitGrowth >= 0 ? '' : 'bad');
      fundHtml += ` <span class="${pgCls}">净利${profitGrowth >= 0 ? '+' : ''}${profitGrowth.toFixed(0)}%</span>`;
    }
    fundHtml += `</div>`;
  }
  if (!fundHtml) fundHtml = '<span class="fund-roe">--</span>';

  // 5分钟KD（优先用stock字段，回退到KDJ_PRECOMPUTED缓存）
  const kd5k = stock.kd5_k !== undefined ? stock.kd5_k : kdj.k;
  const kd5d = stock.kd5_d !== undefined ? stock.kd5_d : kdj.d;
  const kd5Cross = stock.kd5_cross || (kdj.direction === '上升' ? '金叉' : (kdj.direction === '下降' ? '死叉' : ''));
  const kd5Cls = kd5Cross === '金叉' ? 'gold' : 'dead';
  const kd5Html = kd5k !== undefined
    ? `<span class="kd-cell ${kd5Cls}">${kd5k.toFixed(1)} / ${kd5d !== undefined ? kd5d.toFixed(1) : '--'}</span>` +
      `<div class="kd-sub">${kd5Cross}</div>`
    : '<span class="kd-cell">--</span>';

  // 30分钟KD（带水位标签 + 预警标记）
  const kd30Cross = stock.kd30_cross || '';
  const kd30Cls = kd30Cross === '金叉' ? 'gold' : 'dead';
  var _kdLevel = stock._kdLevel || calcKDLevel(stock);
  var _kdEarly = stock._kdEarlySignal || calcKDEarlySignal(stock);
  var kd30BadgeHtml = '';
  if (_kdLevel.level !== 'unknown' && _kdLevel.level !== 'mid' && _kdLevel.level !== 'mid_high' && _kdLevel.label) {
    kd30BadgeHtml = '<span class="kd-badge ' + _kdLevel.cls + '">' + _kdLevel.label + '</span>';
  }
  var kd30EarlyHtml = '';
  if (_kdEarly) {
    kd30EarlyHtml = '<div class="kd-sub" style="color:rgba(29,158,117,1);font-weight:600;">' + _kdEarly.label + '</div>';
  }
  const kd30Html = stock.kd30_k !== undefined
    ? `<span class="kd-cell ${kd30Cls}">${stock.kd30_k.toFixed(1)} / ${stock.kd30_d.toFixed(1)}</span>${kd30BadgeHtml}` +
      `<div class="kd-sub">${kd30Cross}${kd30EarlyHtml ? '' : ''}</div>${kd30EarlyHtml}`
    : '<span class="kd-cell">--</span>';

  // MACD
  const macd = stock.macd || '';
  const macdGold = macd.indexOf('金叉') >= 0;
  const macdHtml = macd
    ? `<span class="macd-text ${macdGold ? 'gold' : 'dead'}">${escapeHtml(macd)}</span>`
    : '<span class="macd-text">--</span>';

  // RSI
  const rsi = stock.rsi;
  let rsiCls = '';
  if (rsi !== undefined && rsi < 30) rsiCls = 'oversold';
  else if (rsi !== undefined && rsi > 70) rsiCls = 'overbought';
  const rsiHtml = rsi !== undefined
    ? `<span class="rsi-text ${rsiCls}">${rsi.toFixed(1)}</span>`
    : '<span class="rsi-text">--</span>';

  // 均线 + 收盘价>20日线条件
  const ma = stock.ma || '';
  const maCls = maClass(ma);
  const ma20val = stock.ma20;
  const livePrice = price !== undefined && price !== null ? price : stock.price;
  const aboveMA20 = ma20val !== undefined && livePrice !== undefined && livePrice !== null && livePrice > ma20val;
  let maHtml = ma ? `<span class="ma-text ${maCls}">${escapeHtml(ma)}</span>` : '<span class="ma-text">--</span>';
  if (ma20val !== undefined && livePrice !== undefined && livePrice !== null) {
    maHtml += `<div class="ma20-sub ${aboveMA20 ? 'above' : 'below'}">${aboveMA20 ? '▲' : '▼'} 收盘${aboveMA20 ? '>' : '<'}20日线 ${ma20val.toFixed(2)}</div>`;
  }

  // 趋势
  const trend = stock.trend || '';
  const tCls = trendClass(trend);
  const trendPct = stock.trendPct;
  let trendStr = escapeHtml(trend || '--');
  if (trendPct !== undefined && trendPct !== null && trendPct !== 0) {
    trendStr += ` <span class="trend-pct">(${trendPct >= 0 ? '+' : ''}${trendPct.toFixed(1)}%)</span>`;
  }
  const trendHtml = `<span class="trend-text ${tCls}">${trendStr}</span>`;

  // 量价信号
  const volHtml = stock.volSignal
    ? `<span class="vol-text">${escapeHtml(stock.volSignal)}</span>`
    : '<span class="vol-text">--</span>';

  // 主力资金（优先显示当天实时数据）
  const mainFlowToday = stock.mainFlowToday;
  const mainFlow = stock.mainFlow || '';
  const mainFlowPos = isPositiveFlow(mainFlow);
  const flowDate = stock.mainFlowDate || '';
  const flowPct = stock.mainFlowPct;
  let flowHtml = '';
  if (mainFlow) {
    flowHtml = `<span class="flow-main ${mainFlowPos ? 'pos' : 'neg'}">${escapeHtml(mainFlow)}</span>`;
    if (flowPct !== undefined && flowPct !== null && flowPct !== 0) {
      flowHtml += `<div class="flow-pct ${flowPct >= 0 ? 'pos' : 'neg'}">占比${flowPct >= 0 ? '+' : ''}${flowPct.toFixed(2)}%</div>`;
    } else if (flowDate) {
      flowHtml += `<div class="flow-date">${flowDate}</div>`;
    }
  } else {
    flowHtml = '<span class="flow-main">--</span>';
  }

  // 30日高开率
  const openRate = stock.openRate30d;
  const openRateHtml = openRate !== undefined
    ? `<span class="open-rate-main">${openRate}%</span>` +
      (stock.openRateTotal !== undefined || stock.openRateScore !== undefined
        ? `<div class="open-rate-sub">全程${stock.openRateTotal !== undefined ? stock.openRateTotal + '%' : '--'} 评${stock.openRateScore !== undefined ? stock.openRateScore : '--'}</div>`
        : '')
    : '<span class="open-rate-main">--</span>';

  // 5日/10日资金
  const f5d = String(stock.flow5d || flow.flow_5d_str || '');
  const f10d = String(stock.flow10d || flow.flow_10d_str || '');
  const f5dPos = isPositiveFlow(f5d);
  const f10dPos = isPositiveFlow(f10d);
  const flowDualHtml =
    `<span class="flow-line ${f5dPos ? 'pos' : (f5d && f5d.indexOf('-') >= 0 ? 'neg' : 'neutral')}">5日 ${escapeHtml(f5d || '--')}</span>` +
    `<span class="flow-line ${f10dPos ? 'pos' : (f10d && f10d.indexOf('-') >= 0 ? 'neg' : 'neutral')}">10日 ${escapeHtml(f10d || '--')}</span>`;

  // 板块共振
  const resonance = stock.sectorResonance || '';
  let resonCls = 'none';
  if (resonance.indexOf('板块启动') >= 0) resonCls = 'active';
  else if (resonance.indexOf('部分') >= 0) resonCls = 'partial';
  const resonDetail = stock.sectorResonanceDetail || '';
  const resonHtml = resonance
    ? `<span class="reson-main ${resonCls}">${escapeHtml(resonance)}</span>` +
      (resonDetail ? `<div class="reson-sub">${escapeHtml(resonDetail)}</div>` : '')
    : '<span class="reson-main none">--</span>';

  // 大盘β
  const beta = stock.beta !== undefined ? stock.beta : (corr.beta !== undefined ? corr.beta : null);
  const betaCat = stock.betaCategory || corr.category || '--';
  const syncRate = stock.syncRate || (corr.sync_5d !== undefined ? corr.sync_5d + '/5' : '--');
  const betaHtml = beta !== null
    ? `<span class="beta-main">β${beta.toFixed(2)}</span> <span class="beta-cat">${escapeHtml(betaCat)}</span>` +
      `<div class="beta-sub">同步 ${syncRate}</div>`
    : '<span class="beta-main">--</span>';

  // 支撑价
  const support = stock.supportPrice;
  const supportDist = stock.supportDist;
  const isNear = supportDist !== undefined && supportDist < 5;
  const supportHtml = support !== undefined
    ? `<span class="support-main ${isNear ? 'near' : ''}">${support.toFixed(2)}</span>` +
      (supportDist !== undefined
        ? `<div class="support-dist">(距${supportDist.toFixed(1)}%)</div>`
        : '')
    : '<span class="support-main">--</span>';

  // 逻辑（兼容 reason 字段）
  const logicText = stock.logic || stock.reason || '';
  const logicHtml = logicText
    ? `<span class="logic-text">${escapeHtml(logicText)}</span>`
    : '<span class="logic-text">--</span>';

  // KD超卖闪烁判断 + KD水位行高亮
  const _kd5k = stock.kd5_k !== undefined ? stock.kd5_k : kdj.k;
  const _kd30k = stock.kd30_k !== undefined ? stock.kd30_k : undefined;
  const _kd60k = stock.kd60_k !== undefined ? stock.kd60_k : undefined;
  const kdOversold = (_kd5k !== undefined && _kd5k < 20) ||
                     (_kd30k !== undefined && _kd30k < 20) ||
                     (_kd60k !== undefined && _kd60k < 20);

  // KD水位行样式
  var _rowCls = kdOversold ? 'kd-oversold' : '';
  if (_kdEarly && _kdEarly.type === 'strong') {
    _rowCls = 'kd-early-row';
  } else if (_kdLevel.level === 'extreme' || _kdLevel.level === 'overbought') {
    _rowCls = 'kd-high-row';
  }

  // 驱动方向子标签（从riskFlags筛选关键驱动信号，排除方向词本身）
  var driverTagsHtml = '';
  if (Array.isArray(stock.riskFlags)) {
    var dirKey = (stock.direction || '').split(',')[0] || '';
    var driverKeyTags = ['主力介入', '主力流出', '回调到位', '止跌回升', '止跌企稳', '企稳', 'T1板块共振', 'T2板块共振', '超跌', '跌势放缓', '资金回流', '资金流入', '资金流出'];
    var tags = stock.riskFlags.filter(function(t) {
      return t !== '🔄全量选入' && t !== dirKey && driverKeyTags.indexOf(t) >= 0;
    });
    if (tags.length > 0) {
      driverTagsHtml = tags.slice(0, 2).map(function(t) {
        return '<span class="dir-tag"><span class="dir-tag-prefix">📊</span>' + escapeHtml(t) + '</span>';
      }).join('');
    }
  }

  // 行
  return `
    <tr id="row-${stock.code}" class="${_rowCls}">
      <td class="col-score"><span class="score-val ${sCls}">${score}</span></td>
      <td><span class="tier-badge tier-${tier}">${tier}</span></td>
      <td><span class="code-text">${num}</span></td>
      <td class="left-align">${nameHtml}${newTag}</td>
      <td class="left-align">${sectorHtml}</td>
      <td class="left-align"><span class="dir-text" title="当日实时主力资金流向">⚡ ${escapeHtml(stock.direction || '--')}</span><div class="dir-tags" title="综合信号判断">${driverTagsHtml}</div></td>
      <td><span class="phase-tag ${pCls}">${escapeHtml(phaseShort)}</span></td>
      <td><span class="price-text ${priceCls}">${price !== undefined && price !== null ? price.toFixed(2) : '--'}</span></td>
      <td><span class="chg-pct ${priceCls}">${chgStr}</span></td>

function renderMobileCard(stock) {
  const score = currentPool === 'launch'
    ? (stock.preLaunchScore !== undefined ? stock.preLaunchScore : stock.healthScore || 0)
    : (stock.score !== undefined ? stock.score : 0);
  const sCls = scoreClass(score);
  const tier = stock.tier || 'T3';
  const num = extractNum(stock.code || '');
  const name = stock.name || '--';
  const changePct = stock.changePct !== undefined ? stock.changePct : null;
  let chgStr = '--';
  let chgCls = 'flat';
  if (changePct !== null) {
    chgStr = (changePct >= 0 ? '+' : '') + changePct.toFixed(2) + '%';
    chgCls = changePct > 0 ? 'up' : (changePct < 0 ? 'down' : 'flat');
  }
  const phaseRaw = stock.phase || stock.preLaunchPhase || '';
  const phaseMap = { 'on_deck': '⏳启动在即', 'approaching': '🔍接近启动', 'building': '🚀启动段', 'launching': '🚀启动段', 'accelerating': '⚡加速段', 'tail': '📉回落段', 'overbought_wait': '⚠️KD高位等回调', 'high_caution': '🟠KD偏高谨慎', 'capital_outflow': '📉资金流出·非启动' };
  const phaseDisp = phaseMap[phaseRaw] || phaseRaw;
  const pCls = phaseClass(phaseDisp);
  const direction = stock.direction || '--';
  const volSignal = stock.volSignal || '--';
  const dragon = stock.dragonTiger === true ? ' <span class="mc-dragon">🐲</span>' : '';
  const cardCls = phaseRaw === 'on_deck' ? 'on-deck' : (phaseRaw === 'approaching' ? 'approaching' : (phaseRaw === 'capital_outflow' ? 'capital-out' : 'building'));

  // 趋势
  const trend = stock.trend || '';
  const trendPct = stock.trendPct;
  let trendStr = trend || '--';
  if (trendPct !== undefined && trendPct !== null && trendPct !== 0) {
    trendStr += ` (${trendPct >= 0 ? '+' : ''}${trendPct.toFixed(1)}%)`;
  }

  // 板块共振
  const resonance = stock.sectorResonance || '';
  let resonShort = '--';
  if (resonance.indexOf('板块启动') >= 0) resonShort = '板块启动';
  else if (resonance.indexOf('部分') >= 0) resonShort = '部分共振';
  else if (resonance) resonShort = resonance;

  // 大盘β
  const beta = stock.beta;
  const betaCat = stock.betaCategory || '--';
  const betaStr = beta !== undefined && beta !== null ? `β${beta.toFixed(2)} ${betaCat}` : '--';

  // 收盘>20日线
  const ma20val = stock.ma20;
  const liveP = quoteData[stock.code] ? quoteData[stock.code].price : stock.price;
  const aboveMA20 = ma20val !== undefined && liveP !== undefined && liveP !== null && liveP > ma20val;
  const ma20Str = ma20val !== undefined && liveP !== undefined
    ? `${aboveMA20 ? '▲' : '▼'}${aboveMA20 ? '>' : '<'}20日线`
    : '--';

  return `<div class="mobile-card ${cardCls}">
    <div class="mc-top">
      <span class="mc-score ${sCls}">${score}</span>
      <span class="mc-tier ${tier}">${tier}</span>
      <span class="mc-name">${escapeHtml(name)}${dragon}</span>
      <span class="mc-code">${num}</span>
      <span class="mc-chg ${chgCls}">${chgStr}</span>
    </div>
    <div class="mc-info">
      <span class="mc-info-item"><span class="mc-phase ${pCls}">${escapeHtml(phaseDisp || '--')}</span></span>
      <span class="mc-info-item"><span class="mc-info-label">驱动</span><span class="mc-info-val">${escapeHtml(direction)}</span></span>
      <span class="mc-info-item"><span class="mc-info-label">量价</span><span class="mc-info-val">${escapeHtml(volSignal)}</span></span>
      <span class="mc-info-item"><span class="mc-info-label">趋势</span><span class="mc-info-val">${escapeHtml(trendStr)}</span></span>
      <span class="mc-info-item"><span class="mc-info-label">共振</span><span class="mc-info-val">${escapeHtml(resonShort)}</span></span>
      <span class="mc-info-item"><span class="mc-info-label">大盘</span><span class="mc-info-val">${escapeHtml(betaStr)}</span></span>
      <span class="mc-info-item"><span class="mc-info-label" style="${aboveMA20 ? 'color:var(--red)' : 'color:var(--green)'}">20日线</span><span class="mc-info-val">${escapeHtml(ma20Str)}</span></span>
    </div>
  </div>`;
}

function renderMobileCards(pool) {
  const container = document.getElementById('mobileCardList');
  if (!container) return;

  if (pool.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-dim);">暂无数据</div>';
    return;
  }

  if (currentPool === 'launch') {
    const phaseGroups = [
      { key: 'on_deck', label: '⏳ 启动在即', cls: 'on-deck' },
      { key: 'approaching', label: '🔍 接近启动', cls: 'approaching' },
      { key: 'building', label: '🚀 启动段', cls: 'building' },
      { key: 'accelerating', label: '⚡ 加速段', cls: 'launched' },
      { key: 'tail', label: '📉 回落段', cls: 'launched' },
      { key: 'overbought', label: '⚠️ KD高位', cls: 'launched' },
      { key: 'capital_outflow', label: '📉 资金流出·非启动', cls: 'capital-out' }
    ];
    const sorted = [...pool].sort((a, b) => (b.preLaunchScore || 0) - (a.preLaunchScore || 0));
    let html = '';
    phaseGroups.forEach(g => {
      const groupStocks = sorted.filter(s => {
        const phase = s.preLaunchPhase || '';
        if (g.key === 'on_deck') return phase === 'on_deck';
        if (g.key === 'approaching') return phase === 'approaching';
        if (g.key === 'building') return phase === 'building' || phase === 'launching';
        if (g.key === 'accelerating') return phase === 'accelerating';
        if (g.key === 'tail') return phase === 'tail';
        if (g.key === 'overbought') return phase === 'overbought_wait' || phase === 'high_caution';
        if (g.key === 'capital_outflow') return phase === 'capital_outflow';
        return false;
      });
      if (groupStocks.length === 0) return;
      html += `<div class="mc-section-header ${g.cls}">${g.label}<span class="mc-count">${groupStocks.length}只</span></div>`;
      groupStocks.forEach(s => { html += renderMobileCard(s); });
    });
    container.innerHTML = html;
  } else {
    container.innerHTML = pool.map(s => renderMobileCard(s)).join('');
  }
}

      { key: 'capital_outflow', label: '📉 资金流出·非启动', cls: 'capital-out',

    ];

    const sorted = [...pool].sort((a, b) => (b.preLaunchScore || 0) - (a.preLaunchScore || 0));
    let html = '';

    phaseGroups.forEach(g => {
      const groupStocks = sorted.filter(s => {
        const phase = s.preLaunchPhase || '';
        if (g.key === 'on_deck') return phase === 'on_deck';
        if (g.key === 'approaching') return phase === 'approaching';
        if (g.key === 'building') return phase === 'building' || phase === 'launching';
        if (g.key === 'accelerating') return phase === 'accelerating';
        if (g.key === 'tail') return phase === 'tail';
        if (g.key === 'overbought') return phase === 'overbought_wait' || phase === 'high_caution';
        if (g.key === 'capital_outflow') return phase === 'capital_outflow';
        return false;
      });
      if (groupStocks.length === 0) return;

      const scores = groupStocks.map(s => s.preLaunchScore || 0);
      const maxS = Math.max(...scores);
      const minS = Math.min(...scores);

      html += `<tr class="phase-section-header ${g.cls}"><td colspan="27">`;
      html += `<span class="phase-header-icon">${g.label}</span>`;

        try {

          console.error('[renderStockRow error]', s.code, e);

  // === 综合最优池模式：按评分降序排序后渲染 ===
  const sortedPool = [...pool].sort((a, b) => {
    const sa = a.healthScore !== undefined ? a.healthScore : (a.preLaunchScore || 0);
    const sb = b.healthScore !== undefined ? b.healthScore : (b.preLaunchScore || 0);
    return sb - sa;
  });
  body.innerHTML = sortedPool.map((s, i) => {
    try {
      return renderStockRow(s, i);

      console.error('[renderStockRow error]', s.code, e);

    if (body) body.innerHTML = '<tr><td colspan="27" style="color:red;padding:20px;">⚠️ renderStocks 错误: ' + e.message + '</td></tr>';
  }
}

// 源1: 腾讯行情 10s → 价格/涨跌幅/换手率/PE/PB/量比/大盘指数
// 源2: 东方财富资金流 30s → 主力净流入/占比（JSONP批量）

let _jsonpSeq = 0;

// JSONP辅助函数（用于东方财富API）
function jsonpRequest(url, timeout, cbParam) {
  timeout = timeout || 8000;
  cbParam = cbParam || 'cb';
  return new Promise(function(resolve) {
    var cbName = '__jcb_' + (++_jsonpSeq) + '_' + Date.now();
    var script = document.createElement('script');
    var done = false;
    window[cbName] = function(data) {
      if (done) return; done = true;
      delete window[cbName]; script.remove();
      resolve(data);
    };
    script.onerror = function() {
      if (done) return; done = true;
      delete window[cbName]; script.remove();
      resolve(null);
    };
    setTimeout(function() {
      if (done) return; done = true;
      delete window[cbName]; script.remove();
      resolve(null);
    }, timeout);
    script.src = url + '&' + cbParam + '=' + cbName;
    document.head.appendChild(script);
  });
}

// 股票代码转东方财富secid格式
function toSecid(code) {
  var num = code.replace(/^(sh|sz|bj)/, '');
  if (code.indexOf('sh') === 0) return '1.' + num;
  return '0.' + num;
}

// 格式化资金金额
function formatFlowAmt(val) {
  if (val === null || val === undefined || isNaN(val)) return '--';
  var abs = Math.abs(val), sign = val >= 0 ? '+' : '-';
  if (abs >= 1e8) return sign + (abs / 1e8).toFixed(2) + '亿';
  if (abs >= 1e4) return sign + (abs / 1e4).toFixed(0) + '万';
  return sign + abs.toFixed(0);
}

// ============================================
// 源3: KDJ+MACD实时计算（5/30/60分钟三周期，东方财富K线+JS计算）
// 算法：标准KDJ(9,3,3)，从第一根K线开始遍历，200根充分预热
// 数据源：东方财富 push2his.eastmoney.com（JSONP绕CORS）
// ============================================

// KDJ(9,3,3) 标准算法 — 与通达信/同花顺/东方财富一致
// 关键修复：从第0根K线开始遍历，K/D从50,50逐步收敛
function calcKDJ(klines, n) {
  n = n || 9;
  if (!klines || klines.length < n) return null;

  var k = 50, d = 50;
  var prevK = 50, prevD = 50;

  for (var i = 0; i < klines.length; i++) {
    var parts = klines[i].split(',');
    var close = parseFloat(parts[2]);
    var high = -Infinity, low = Infinity;

    var lookback = Math.min(n, i + 1);
    for (var j = i - lookback + 1; j <= i; j++) {
      var p = klines[j].split(',');
      var h = parseFloat(p[3]);
      var l = parseFloat(p[4]);
      if (h > high) high = h;
      if (l < low) low = l;
    }

    var rsv = 50;
    if (high !== low) rsv = ((close - low) / (high - low)) * 100;

    prevK = k;
    prevD = d;
    k = (2/3) * k + (1/3) * rsv;
    d = (2/3) * d + (1/3) * k;
  }

  var j = 3 * k - 2 * d;
  var cross = '';
  if (prevK <= prevD && k > d) cross = '金叉';
  else if (prevK >= prevD && k < d) cross = '死叉';
  else if (k > d) cross = '上升';
  else cross = '下降';

  return { k: k, d: d, j: j, cross: cross };
}

// MACD(12,26,9) 标准算法
function calcMACD(klines) {
  if (!klines || klines.length < 35) return null;
  var closes = [];
  for (var i = 0; i < klines.length; i++) {
    closes.push(parseFloat(klines[i].split(',')[2]));
  }
  var s = 12, l = 26, sig = 9;
  var es = closes[0], el = closes[0];
  var difs = [];
  for (var i = 0; i < closes.length; i++) {
    es = (s-1)/(s+1) * es + 2/(s+1) * closes[i];
    el = (l-1)/(l+1) * el + 2/(l+1) * closes[i];
    difs.push(es - el);
  }
  var dea = difs[0];
  for (var i = 0; i < difs.length; i++) {
    dea = (sig-1)/(sig+1) * dea + 2/(sig+1) * difs[i];
  }
  var cross = difs[difs.length-1] > dea ? '金叉' : '死叉';
  var bar = 2 * (difs[difs.length-1] - dea) > 0 ? '红柱' : '绿柱';
  return cross + ' ' + bar;
}

// ============================================
// 日线指标实时计算引擎（RSI/MA/趋势/支撑/Beta/评分/方向/共振）
// 数据源：东方财富日线K线（klt=101）+ 指数日线 + 实时行情
// ============================================
var INDEX_CLOSES = null;  // 指数日线缓存（Beta计算用）

// RSI(14) — Wilder平滑法
function calcRSI(klines, period) {
  period = period || 14;
  if (!klines || klines.length < period + 1) return null;
  var closes = [];
  for (var i = 0; i < klines.length; i++) closes.push(parseFloat(klines[i].split(',')[2]));
  var gains = 0, losses = 0;
  for (var i = 1; i <= period; i++) {
    var d = closes[i] - closes[i - 1];
    if (d > 0) gains += d; else losses -= d;
  }
  var avgGain = gains / period, avgLoss = losses / period;
  for (var i = period + 1; i < closes.length; i++) {
    var d = closes[i] - closes[i - 1];
    avgGain = (avgGain * (period - 1) + (d > 0 ? d : 0)) / period;
    avgLoss = (avgLoss * (period - 1) + (d < 0 ? -d : 0)) / period;
  }
  if (avgLoss === 0) return 100;
  return parseFloat((100 - 100 / (1 + avgGain / avgLoss)).toFixed(1));
}

// MA多头排列 + MA20值 + 高开率
function calcMAFull(klines) {
  if (!klines || klines.length < 5) return null;
  var closes = [], opens = [];
  for (var i = 0; i < klines.length; i++) {
    var p = klines[i].split(',');
    opens.push(parseFloat(p[1]));
    closes.push(parseFloat(p[2]));
  }
  function ma(n) {
    if (closes.length < n) return null;
    var s = 0;
    for (var i = closes.length - n; i < closes.length; i++) s += closes[i];
    return s / n;
  }
  var ma5 = ma(5), ma10 = ma(10), ma20 = ma(20), ma60 = ma(60);
  var text = '';
  if (ma5 && ma10 && ma20) {
    if (ma5 > ma10 && ma10 > ma20) text = '多头排列';
    else if (ma5 < ma10 && ma10 < ma20) text = '空头排列';
    else text = '交叉震荡';
  }
  // 30日高开率
  var openRate30d = 0;
  var total = Math.min(30, closes.length - 1);
  if (total > 0) {
    var count = 0;
    for (var i = closes.length - total; i < closes.length; i++) {
      if (opens[i] > closes[i - 1]) count++;
    }
    openRate30d = Math.round(count / total * 100);
  }
  var openRateTotal = 0;
  var totalAll = closes.length - 1;
  if (totalAll > 0) {
    var countAll = 0;
    for (var i = 1; i < closes.length; i++) {
      if (opens[i] > closes[i - 1]) countAll++;
    }
    openRateTotal = Math.round(countAll / totalAll * 100);
  }
  var openRateScore = openRate30d >= 70 ? 5 : (openRate30d >= 60 ? 4 : (openRate30d >= 50 ? 3 : (openRate30d >= 40 ? 2 : 1)));
  return { ma5: ma5, ma10: ma10, ma20: ma20, ma60: ma60, maText: text, openRate30d: openRate30d, openRateTotal: openRateTotal, openRateScore: openRateScore };
}

// 趋势 + 5日涨跌幅
function calcTrendDaily(klines) {
  if (!klines || klines.length < 6) return null;
  var closes = [];
  for (var i = 0; i < klines.length; i++) closes.push(parseFloat(klines[i].split(',')[2]));
  var cur = closes[closes.length - 1];
  var ago5 = closes[closes.length - 6];
  var trendPct = ((cur - ago5) / ago5 * 100);
  function ma(n) {
    if (closes.length < n) return 0;
    var s = 0;
    for (var i = closes.length - n; i < closes.length; i++) s += closes[i];
    return s / n;
  }
  var ma5 = ma(5), ma10 = ma(10), ma20 = ma(20);
  var trend = '震荡整理';
  if (cur > ma5 && ma5 > ma10 && ma10 > ma20) trend = '上涨趋势';
  else if (cur < ma5 && ma5 < ma10 && ma10 < ma20) trend = '下跌趋势';
  return { trend: trend, trendPct: parseFloat(trendPct.toFixed(1)) };
}

// 支撑价 + 距离（20日最低价）
function calcSupportDaily(klines) {
  if (!klines || klines.length < 5) return null;
  var lookback = Math.min(20, klines.length);
  var lowest = Infinity;
  for (var i = klines.length - lookback; i < klines.length; i++) {
    var low = parseFloat(klines[i].split(',')[4]);
    if (low < lowest) lowest = low;
  }
  var cur = parseFloat(klines[klines.length - 1].split(',')[2]);
  var dist = ((cur - lowest) / cur * 100);
  return { supportPrice: parseFloat(lowest.toFixed(2)), supportDist: parseFloat(dist.toFixed(1)) };
}

// Beta系数 + 同步率（需要指数日线）
function calcBetaSync(stockKlines, indexCloses) {
  if (!stockKlines || !indexCloses || stockKlines.length < 20 || indexCloses.length < 20) return null;
  var stockCloses = [];
  for (var i = 0; i < stockKlines.length; i++) stockCloses.push(parseFloat(stockKlines[i].split(',')[2]));
  var n = Math.min(stockCloses.length, indexCloses.length);
  if (n < 20) return null;
  var sR = [], iR = [];
  for (var i = n - Math.min(n, 60); i < n; i++) {
    if (i < 1 || stockCloses[i - 1] === 0 || indexCloses[i - 1] === 0) continue;
    sR.push((stockCloses[i] - stockCloses[i - 1]) / stockCloses[i - 1]);
    iR.push((indexCloses[i] - indexCloses[i - 1]) / indexCloses[i - 1]);
  }
  var m = sR.length;
  if (m < 10) return null;
  var ms = 0, mi = 0, msi = 0, mii = 0;
  for (var i = 0; i < m; i++) { ms += sR[i]; mi += iR[i]; msi += sR[i] * iR[i]; mii += iR[i] * iR[i]; }
  ms /= m; mi /= m;
  var cov = msi / m - ms * mi;
  var varI = mii / m - mi * mi;
  if (varI === 0) return null;
  var beta = parseFloat((cov / varI).toFixed(2));
  // 5日同步率
  var syncCount = 0;
  var syncN = Math.min(5, sR.length);
  for (var i = sR.length - syncN; i < sR.length; i++) {
    if ((sR[i] > 0 && iR[i] > 0) || (sR[i] < 0 && iR[i] < 0)) syncCount++;
  }
  var cat = beta > 1.3 ? '高β进攻' : (beta > 0.8 ? '中β跟随' : (beta > 0.3 ? '低β防御' : '逆势'));
  return { beta: beta, category: cat, syncRate: syncCount + '/' + syncN };
}

// 实时评分重算（基于原始基础分+实时信号偏移）
// KD多级水位评估（基于30分钟KD，启动段主周期）
function calcKDLevel(stock) {
  var k = stock.kd30_k, d = stock.kd30_d;
  if (k === undefined) return { level: 'unknown', label: '', cls: '', score: 0 };
  var k5Up = (stock.kd5_k !== undefined && stock.kd5_d !== undefined && stock.kd5_k > stock.kd5_d);
  var turning = (d !== undefined && k > d) || k5Up;

  if (k < 15) return { level: 'deep', label: '深超卖', cls: 'kd-deep', score: 8, icon: '🎯' };
  if (k < 25 && turning) return { level: 'low_turning', label: '低位拐头', cls: 'kd-low', score: 6, icon: '🟢' };
  if (k < 25) return { level: 'low', label: '低位', cls: 'kd-low', score: 4, icon: '🔵' };
  if (k < 40 && k > d) return { level: 'rising', label: '低位金叉', cls: 'kd-low', score: 4, icon: '✅' };
  if (k < 40) return { level: 'low_flat', label: '低位盘整', cls: 'kd-mid', score: 2, icon: '' };
  if (k < 65) return { level: 'mid', label: '中位', cls: 'kd-mid', score: 1, icon: '' };
  if (k < 75) return { level: 'mid_high', label: '中高位', cls: 'kd-mid', score: 0, icon: '' };
  if (k < 85) return { level: 'high', label: '偏高', cls: 'kd-high', score: -3, icon: '🟠' };
  if (k < 90) return { level: 'overbought', label: '高位', cls: 'kd-high', score: -6, icon: '🔴' };
  return { level: 'extreme', label: '超买', cls: 'kd-extreme', score: -10, icon: '⛔' };
}

// 多周期KD共振预警（5分钟领先30分钟）
function calcKDEarlySignal(stock) {
  var k5 = stock.kd5_k, d5 = stock.kd5_d;
  var k30 = stock.kd30_k, d30 = stock.kd30_d;
  var k60 = stock.kd60_k;
  var rsi = stock.rsi;
  if (k30 === undefined) return null;

  var k5Up = (k5 !== undefined && d5 !== undefined && k5 > d5);
  var k30ApproachingD = (d30 !== undefined && Math.abs(k30 - d30) < 5);
  var k30Low = k30 < 35;
  var rsiLow = (rsi !== undefined && rsi < 40);
  var k60Low = (k60 === undefined || k60 < 50);

  // 强预警：30分钟KD深低位 + 5分钟已拐头 + 60分钟未超买
  if (k30 < 25 && k5Up && k60Low) {
    return { type: 'strong', label: '🎯KD强预警', detail: '30分钟KD<' + k30.toFixed(0) + ' + 5分钟已拐头' };
  }
  // 中等预警：30分钟KD低位 + K接近D + 5分钟已拐头 + RSI低位
  if (k30Low && k30ApproachingD && k5Up && rsiLow) {
    return { type: 'medium', label: '🟢KD预警', detail: '30分钟K接近D + 5分钟领先' };
  }
  // 弱预警：30分钟KD低位 + 5分钟KD也在低位且拐头
  if (k30Low && k5Up && k5 !== undefined && k5 < 30) {
    return { type: 'weak', label: '🔵KD待确认', detail: '5分钟KD低位拐头，待30分钟跟随' };
  }
  return null;
}

function recalcScore(stock) {
  if (!stock._baseScore) stock._baseScore = stock.healthScore || stock.preLaunchScore || 50;
  var base = stock._baseScore;
  var adj = 0;

  // === KD水位评分（新核心逻辑：按绝对位置分级，不再只看金叉/死叉）===
  var kdLevel = calcKDLevel(stock);
  adj += kdLevel.score;

  // 金叉/死叉仍然有额外加成，但只在低位时
  if (stock.kd30_cross === '金叉' && stock.kd30_k < 50) adj += 3;
  else if (stock.kd30_cross === '死叉' && stock.kd30_k > 50) adj -= 3;

  // 5分钟KD交叉辅助确认
  if (stock.kd5_cross === '金叉' && stock.kd30_k < 50) adj += 2;
  else if (stock.kd5_cross === '死叉' && stock.kd30_k > 60) adj -= 2;

  // 60分钟KD趋势确认
  if (stock.kd60_cross === '金叉' && stock.kd60_k < 60) adj += 2;
  else if (stock.kd60_cross === '死叉' && stock.kd60_k > 70) adj -= 2;

  // MACD
  if (stock.macd && stock.macd.indexOf('金叉') >= 0) adj += 3;
  else if (stock.macd && stock.macd.indexOf('死叉') >= 0) adj -= 3;

  // 资金流
  if (stock.mainFlowToday !== undefined && stock.mainFlowToday > 0) adj += 3;
  else if (stock.mainFlowToday !== undefined && stock.mainFlowToday < 0) adj -= 3;

  // 量价
  if (stock.volSignal === '放量' || stock.volSignal === '温和放量') adj += 2;
  else if (stock.volSignal === '极度缩量' || stock.volSignal === '明显缩量') adj -= 2;

  // 均线
  if (stock.ma20 !== undefined && stock.price !== undefined) {
    if (stock.price > stock.ma20) adj += 2; else adj -= 2;
  }

  // RSI
  if (stock.rsi !== undefined) {
    if (stock.rsi < 30) adj += 3;
    else if (stock.rsi > 70) adj -= 3;
  }

  // 趋势
  if (stock.trend === '上涨趋势') adj += 2;
  else if (stock.trend === '下跌趋势') adj -= 2;

  var newScore = Math.max(0, Math.min(100, Math.round(base + adj)));
  stock.tier = newScore >= 80 ? 'A' : (newScore >= 65 ? 'B' : (newScore >= 50 ? 'C' : 'D'));
  stock._kdLevel = kdLevel;
  stock._kdEarlySignal = calcKDEarlySignal(stock);
  return newScore;
}

// 实时方向重新生成（阶段前缀+信号后缀）
function regenDirection(stock) {
  var phaseMap = { 'on_deck': '⏳启动在即', 'approaching': '🔍接近启动', 'building': '🚀启动段', 'launching': '🚀启动段', 'accelerating': '⚡加速段', 'tail': '📉回落段', 'overbought_wait': '⚠️KD高位等回调', 'high_caution': '🟠KD偏高谨慎', 'capital_outflow': '📉资金流出·非启动' };
  var phase = phaseMap[stock.preLaunchPhase] || '';
  var hasGold = (stock.kd5_cross === '金叉' || stock.kd30_cross === '金叉');
  var hasDead = (stock.kd5_cross === '死叉' || stock.kd30_cross === '死叉');
  var flowPos = (stock.mainFlowToday !== undefined && stock.mainFlowToday > 0);
  var flowNeg = (stock.mainFlowToday !== undefined && stock.mainFlowToday < 0);
  var suffix = '';
  if (hasGold && flowPos) suffix = '主力做多';
  else if (hasDead && flowNeg) suffix = '主力做空';
  else if (hasGold && flowNeg) suffix = '技术反弹';
  else if (hasDead && flowPos) suffix = '蓄势整理';
  else if (flowPos) suffix = '资金流入';
  else if (flowNeg) suffix = '资金流出';
  else suffix = '观望';
  return (phase + ' ' + suffix).trim();
}

// 板块共振（基于实时板块行情数据匹配）
function calcSectorResonance(stock) {
  if (!liveHotSectors || liveHotSectors.length === 0 || !stock.sector) return null;
  var sectorName = stock.sector.replace(/热门/g, '');
  for (var i = 0; i < liveHotSectors.length; i++) {
    var hsName = liveHotSectors[i].name || '';
    if (hsName.indexOf(sectorName) >= 0 || sectorName.indexOf(hsName) >= 0) {

      return null;

  return null;
}

        if (anyUpdate) updated++;
      }).catch(function() {}).then(function() {
        done++;
        if (done % 10 === 0 || done === total) {
          if (updated > 0) {
            liveFlags.kdj = true;
            updateLiveStatus();
          }
          renderStocks();
        }
      });
    }, i * 300);
  });
}

// 四个模块全部从东方财富API实时拉取，保留静态数据作为fallback

var liveHotSectors = [];     // 实时板块风口
var liveNewsData = [];       // 实时消息面
var liveCalendarData = [];   // 实时催化日历
