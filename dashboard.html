// --- 1. 主线风口：实时板块行情（30秒刷新）---
async function fetchHotSectors() {
  try {
    // 行业板块 m:90+t:2，按主力资金净流入排序
    // 多域名轮转，fallback到预计算数据
    var domains = ['push2.eastmoney.com', '82.push2.eastmoney.com', '48.push2.eastmoney.com', '29.push2.eastmoney.com'];
    var data = null;
    for (var di = 0; di < domains.length; di++) {
      try {
        var url = 'https://' + domains[di] + '/api/qt/clist/get?fs=m:90+t:2&fields=f2,f3,f4,f12,f14,f62,f184,f66,f69,f72,f75,f78,f81,f84,f87,f104,f105&fid=f62&po=1&pz=30&pn=1&_=' + Date.now();
        data = await jsonpRequest(url, 5000);
        if (data && data.data && data.data.diff) break;
      } catch(e) { /* try next domain */ }
    }
    if (!data || !data.data || !data.data.diff) {
      console.warn('[fetchHotSectors] push2 clist API全部不可达，使用预计算板块数据');
      if (typeof SECTOR_FALLBACK !== 'undefined' && SECTOR_FALLBACK.length > 0) {
        liveHotSectors = SECTOR_FALLBACK.map(function(s) {
          var chg = s.changePct || 0;
          var status = chg > 5 ? '🔥主升浪' : (chg > 2 ? '🔥强势' : (chg > 0 ? '⬆走强' : '⬇走弱'));
          return {
            name: s.name, changePct: chg, mainFlow: s.mainFlow || 0,
            mainFlowPct: s.mainFlowPct || 0, superLargeFlow: s.superLargeFlow || 0,
            largeFlow: s.largeFlow || 0, upCount: s.upCount || 0, downCount: s.downCount || 0,
            code: s.code, status: status
          };
        });
        extraFlags.sectors = true;
        renderHotspots();
        console.log('[fetchHotSectors] 使用预计算数据: ' + liveHotSectors.length + '个板块');
      }
      return;
    }
    var rows = data.data.diff;
    liveHotSectors = rows.map(function(s) {
      var chg = s.f3 || 0;
      var mainFlow = (s.f62 || 0) / 1e8;
      var superFlow = (s.f66 || 0) / 1e8;
      var status = chg > 5 ? '🔥主升浪' : (chg > 2 ? '🔥强势' : (chg > 0 ? '⬆走强' : '⬇走弱'));
      return {
        name: s.f14 || '--',
        changePct: chg,
        mainFlow: mainFlow,
        mainFlowPct: s.f184 || 0,
        superLargeFlow: superFlow,
        largeFlow: (s.f72 || 0) / 1e8,
        upCount: s.f104 || 0,
        downCount: s.f105 || 0,
        code: s.f12 || '',
        status: status
      };
    });
    // 按主力资金净流入排序
    liveHotSectors.sort(function(a, b) { return b.mainFlow - a.mainFlow; });
    liveHotSectors = liveHotSectors.slice(0, 15);
    extraFlags.sectors = true;
    renderHotspots();
    console.log('[fetchHotSectors] 获取' + liveHotSectors.length + '个板块');
  } catch(e) {
    console.error('[fetchHotSectors]', e);
  }
}

// --- 时间辅助 ---
function getNowStr() {
  var d = new Date();
  var h = String(d.getHours()).padStart(2, '0');
  var m = String(d.getMinutes()).padStart(2, '0');
  return h + ':' + m;
}
function getDateStr() {
  var d = new Date();
  return (d.getMonth() + 1) + '/' + d.getDate();
}
function getWeekdayStr() {
  var w = ['日','一','二','三','四','五','六'];
  return '周' + w[new Date().getDay()];
}

// --- 2. 消息面：基于板块行情生成实时市场快讯（60秒刷新）---
// 原np-listapi不支持浏览器端CORS/JSONP，改用push2板块数据衍生
async function fetchNewsData() {
  try {
    if (liveHotSectors.length === 0) { await fetchHotSectors(); }
    if (liveHotSectors.length === 0) {
      console.warn('[fetchNewsData] 板块数据为空');
      return;
    }
    var news = [];
    var nowStr = getNowStr();
    var sorted = liveHotSectors.slice().sort(function(a, b) { return b.changePct - a.changePct; });
    // 涨幅TOP
    sorted.slice(0, 4).forEach(function(s) {
      if (Math.abs(s.changePct) > 0.05) {
        news.push({
          title: (s.changePct > 0 ? '🚀 ' : '📉 ') + s.name + '板块' + (s.changePct > 0 ? '领涨' : '领跌') + ' ' + (s.changePct > 0 ? '+' : '') + s.changePct.toFixed(2) + '%',
          time: nowStr, source: '实时行情', type: '市场快讯',
          impact: s.changePct > 0 ? '利好' : '利空'
        });
      }
    });
    // 资金流入TOP
    var flowSorted = liveHotSectors.slice().sort(function(a, b) { return b.mainFlow - a.mainFlow; });
    flowSorted.slice(0, 3).forEach(function(s) {
      if (Math.abs(s.mainFlow) > 0.3) {
        news.push({
          title: '💰 主力资金' + (s.mainFlow > 0 ? '涌入' : '流出') + s.name + ' ' + (s.mainFlow > 0 ? '+' : '') + s.mainFlow.toFixed(2) + '亿',
          time: nowStr, source: '资金流向', type: '市场快讯',
          impact: s.mainFlow > 0 ? '利好' : '利空'
        });
      }
    });
    // 涨跌比异常
    var extremeUp = liveHotSectors.filter(function(s) { return s.upCount > 0 && s.downCount === 0; });
    if (extremeUp.length > 0) {
      news.push({
        title: '🔥 ' + extremeUp.slice(0, 3).map(function(s) { return s.name; }).join('、') + ' 全线上涨',
        time: nowStr, source: '板块统计', type: '市场快讯', impact: '利好'
      });
    }
    liveNewsData = news;
    if (news.length > 0) {
      extraFlags.news = true;
      renderCatalystNews();
      console.log('[fetchNewsData] 生成' + news.length + '条市场快讯');
    }
  } catch(e) {
    console.error('[fetchNewsData]', e);
  }
}

function classifyNews(title) {
  if (/业绩|净利|预增|扭亏|盈利|财报|中报|年报|一季报/.test(title)) return '业绩预告';
  if (/政策|规划|补贴|减税|国务院|发改委|财政部|央行|证监会|工信部|支持|鼓励/.test(title)) return '行业政策';
  if (/技术|突破|专利|芯片|算法|创新|研发|首条|首发/.test(title)) return '技术创新';
  if (/大宗|有色|原油|黄金|铜|锂|稀土|煤|铁矿|锌|镍/.test(title)) return '资源价格';
  return '市场快讯';
}

// --- 3. 催化日历：基于板块+个股行情生成今日催化事件（5分钟刷新）---
// 原datacenter-web经济日历报表名已失效，改用push2实时数据衍生
async function fetchCalendarData() {
  try {
    if (liveHotSectors.length === 0) { await fetchHotSectors(); }
    var events = [];
    var dateStr = getDateStr();
    var weekdayStr = getWeekdayStr();
    var nowStr = getNowStr();

    // 板块催化
    if (liveHotSectors.length > 0) {
      var top = liveHotSectors.slice().sort(function(a, b) { return b.changePct - a.changePct; }).slice(0, 3);
      top.forEach(function(s) {
        if (Math.abs(s.changePct) > 0.1) {
          events.push({
            date: dateStr + ' ' + weekdayStr, time: nowStr,
            event: s.name + '板块' + (s.changePct > 0 ? '大涨' : '回调') + ' ' + Math.abs(s.changePct).toFixed(2) + '%',
            type: '板块催化',
            impact: Math.abs(s.changePct) > 3 ? '高' : '中',
            detail: '主力' + (s.mainFlow > 0 ? '净流入' : '净流出') + Math.abs(s.mainFlow).toFixed(2) + '亿 | ' + s.upCount + '涨/' + s.downCount + '跌',
            related: [s.name]
          });
        }
      });
      var flowTop = liveHotSectors.slice().sort(function(a, b) { return b.mainFlow - a.mainFlow; }).slice(0, 2);
      flowTop.forEach(function(s) {
        if (Math.abs(s.mainFlow) > 1) {
          events.push({
            date: dateStr + ' ' + weekdayStr, time: nowStr,
            event: s.name + '板块获主力资金' + (s.mainFlow > 0 ? '净流入' : '净流出') + Math.abs(s.mainFlow).toFixed(2) + '亿',
            type: '资金催化',
            impact: '中',
            detail: '涨幅' + s.changePct.toFixed(2) + '% | 上涨' + s.upCount + '家 | 下跌' + s.downCount + '家',
            related: [s.name]
          });
        }
      });
    }

    // 个股催化（从选股池提取大涨股）
    if (typeof STOCKS !== 'undefined' && STOCKS.length > 0 && typeof quoteData !== 'undefined') {
      var topStocks = STOCKS.filter(function(s) {
        var q = quoteData[s.code];
        return q && q.changePct !== undefined && q.changePct >= 5;
      }).slice(0, 3);
      topStocks.forEach(function(s) {
        var q = quoteData[s.code];
        events.push({
          date: dateStr + ' ' + weekdayStr, time: nowStr,
          event: (s.name || s.code) + '大涨' + q.changePct.toFixed(2) + '%',
          type: '个股催化',
          impact: q.changePct >= 9 ? '高' : '中',
          detail: '现价' + q.price + (s.mainFlowToday !== undefined ? ' | 主力' + (s.mainFlowToday > 0 ? '流入' : '流出') + Math.abs(s.mainFlowToday / 1e4).toFixed(2) + '万' : ''),
          related: [s.sector || s.name || s.code]
        });
      });
    }

    liveCalendarData = events;
    if (events.length > 0) {
      extraFlags.calendar = true;
      renderCalendar();
      console.log('[fetchCalendarData] 生成' + events.length + '条催化事件');
    } else {
      extraFlags.calendar = true;
      renderCalendar();
      console.log('[fetchCalendarData] 非交易日或无数据，显示提示');
    }
  } catch(e) {
    console.error('[fetchCalendarData]', e);
  }
}

// 立即应用KDJ_FALLBACK数据到所有股票（在首次渲染前调用）
function applyKDJFallbackEarly() {
  if (_fallbackApplied) return;
  if (typeof KDJ_FALLBACK === 'undefined') return;
  var keys = Object.keys(KDJ_FALLBACK);
  if (keys.length === 0) return;
  var allPool = [...STOCKS, ...LAUNCH_STOCKS];
  var updated = 0;
  allPool.forEach(function(stock) {
    var fb = KDJ_FALLBACK[stock.code];
    if (fb) {
      try {
        if (fb.kd5_k !== undefined) stock.kd5_k = fb.kd5_k;
        if (fb.kd5_d !== undefined) stock.kd5_d = fb.kd5_d;
        if (fb.kd30_k !== undefined) stock.kd30_k = fb.kd30_k;
        if (fb.kd30_d !== undefined) stock.kd30_d = fb.kd30_d;
        if (fb.kd30_cross !== undefined) stock.kd30_cross = fb.kd30_cross;
        if (fb.kd60_k !== undefined) stock.kd60_k = fb.kd60_k;
        if (fb.kd60_d !== undefined) stock.kd60_d = fb.kd60_d;
        if (fb.kd60_cross !== undefined) stock.kd60_cross = fb.kd60_cross;
        if (fb.macd !== undefined) stock.macd = fb.macd;
        if (fb.ma !== undefined) stock.ma = fb.ma;
        if (fb.ma20 !== undefined) stock.ma20 = fb.ma20;
        if (fb.maAbove !== undefined) stock.maAbove = fb.maAbove;
        if (fb.rsi !== undefined) stock.rsi = fb.rsi;
        if (fb.drop20d !== undefined) stock.drop20d = fb.drop20d;
        if (fb.volRatio !== undefined) stock.volRatio = fb.volRatio;
        if (fb.openRate30d !== undefined) stock.openRate30d = fb.openRate30d;
        if (fb.openRateTotal !== undefined) stock.openRateTotal = fb.openRateTotal;
        if (fb.openRateScore !== undefined) stock.openRateScore = fb.openRateScore;
        if (fb.pe !== undefined && fb.pe > 0) stock.pe = fb.pe;
        if (fb.pb !== undefined && fb.pb > 0) stock.pb = fb.pb;
        if (fb.mainFlow !== undefined) stock.mainFlow = fb.mainFlow;
        if (fb.mainFlowDate !== undefined) stock.mainFlowDate = fb.mainFlowDate;
        if (fb.mainFlowToday !== undefined) stock.mainFlowToday = fb.mainFlowToday;
        if (fb.mainFlow5d !== undefined) stock.mainFlow5d = fb.mainFlow5d;
        if (fb.mainFlowPct !== undefined) stock.mainFlowPct = fb.mainFlowPct;
        // 5日/10日资金流
        if (fb.flow5d !== undefined) stock.flow5d = fb.flow5d;
        if (fb.flow10d !== undefined) stock.flow10d = fb.flow10d;
        // 基本面
        if (fb.roe !== undefined) stock.roe = fb.roe;
        if (fb.grossMargin !== undefined) stock.grossMargin = fb.grossMargin;
        if (fb.revGrowth !== undefined) stock.revGrowth = fb.revGrowth;
        if (fb.profitGrowth !== undefined) stock.profitGrowth = fb.profitGrowth;
        // 大盘β
        if (fb.beta !== undefined) stock.beta = fb.beta;
        if (fb.betaCategory !== undefined) stock.betaCategory = fb.betaCategory;
        if (fb.syncRate !== undefined) stock.syncRate = fb.syncRate;
        // 阶段
        if (fb.preLaunchPhase !== undefined) stock.preLaunchPhase = fb.preLaunchPhase;
        // 逻辑
        if (fb.reason !== undefined) stock.reason = fb.reason;
        if (fb.logic !== undefined) stock.logic = fb.logic;
        // 实时价格/涨跌幅/换手率
        if (fb.price !== undefined) stock.price = fb.price;
        if (fb.changePct !== undefined) stock.changePct = fb.changePct;
        if (fb.turnover !== undefined) stock.turnover = fb.turnover;
        // 板块
        if (fb.sector !== undefined && !stock.sector) stock.sector = fb.sector;
        // 趋势 + 5日涨跌幅
        if (fb.trend !== undefined) stock.trend = fb.trend;
        if (fb.trendPct !== undefined) stock.trendPct = fb.trendPct;
        // 板块共振
        if (fb.sectorResonance !== undefined) stock.sectorResonance = fb.sectorResonance;
        if (fb.sectorResonanceDetail !== undefined) stock.sectorResonanceDetail = fb.sectorResonanceDetail;
        // 量价信号（从volRatio推算）
        if (fb.volRatio !== undefined && !stock.volSignal) {
          var _vr = fb.volRatio;
          if (_vr < 0.7) stock.volSignal = '极度缩量';
          else if (_vr < 0.85) stock.volSignal = '明显缩量';
          else if (_vr < 0.95) stock.volSignal = '轻微缩量';
          else if (_vr <= 1.5) stock.volSignal = '正常';
          else if (_vr <= 2.0) stock.volSignal = '温和放量';
          else stock.volSignal = '放量';
        }
        // 支撑价（用MA20作为近似支撑位）
        if (fb.ma20 !== undefined && stock.supportPrice === undefined) {
          stock.supportPrice = fb.ma20;
          var _price = stock.price || 0;
          if (_price > 0 && fb.ma20 > 0) {
            stock.supportDist = ((_price - fb.ma20) / _price * 100);
          }
        }
        // 重算评分和方向（基于fallback数据）
        try {
          stock.healthScore = recalcScore(stock);
          stock.direction = regenDirection(stock);
        } catch(e2) { /* 评分失败不影响数据显示 */ }
        updated++;
      } catch(e) {
        console.error('[applyKDJFallbackEarly] error for', stock.code, e.message);
      }
    }
  });
  _fallbackApplied = true;
  console.log('[applyKDJFallbackEarly] Applied fallback to ' + updated + ' stocks');
}
