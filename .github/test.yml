name: Auto Update Dashboard

on:
  schedule:
    # 北京时间(UTC+8) = UTC时间 + 8小时
    # 09:35 CST = 01:35 UTC, 11:35 CST = 03:35 UTC
    # 13:35 CST = 05:35 UTC, 15:05 CST = 07:05 UTC
    - cron: '35 1 * * 1-5'
    - cron: '35 3 * * 1-5'
    - cron: '35 5 * * 1-5'
    - cron: '5 7 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run dashboard update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_FILE: dashboard.html
        run: python update_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update dashboard data @ $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
